# Cross-compilation config for `cross` (cross-rs), used by
# .github/workflows/release-publish.yml for both Linux gnu
# targets.
#
# `git` is installed for both targets because the workspace's git
# dependencies (coppa-{dsp,audio,channel}) are fetched INSIDE the cross-rs
# container, and this repo's .cargo/config.toml sets `[net]
# git-fetch-with-cli = true` -- so cargo needs a `git` binary there, not just
# on the host runner. apt is a no-op if the image already carries one.
#
# `cpal` (live audio input, crates/manta-input) is an unconditional
# dependency -- not behind any feature flag -- and its Linux backend links
# against ALSA (`libasound2-dev`) at build time.
#
# The arm64 SoapySDR archive (manta-linux-arm64-soapy.tar.gz) is not built
# here: cross-rs 0.2.5's aarch64 image is Ubuntu 16.04 and packages no
# SoapySDR, so no `pre-build` line can add `libsoapysdr-dev:arm64`. The
# release workflow's `build-soapy-arm64` job builds it natively in Debian
# bookworm instead (MAN-539,
# docs/DECISIONS/2026-11-08-man539-arm64-soapy-archive-and-image.md).
#
# x86_64-unknown-linux-gnu is built via `cross` too, not natively on the
# runner -- deliberately, to build against cross-rs's older glibc
# baseline rather than the current ubuntu-latest runner's, so the
# released binary doesn't raise its minimum glibc symbol-version
# requirement above what's still available on RHEL 8/Debian 11/Ubuntu
# 20.04-class systems (PR #78 review round 1). Native amd64 in the
# container, so no cross-arch dpkg dance needed here.
[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update",
    "apt-get install --assume-yes libasound2-dev git",
]

# aarch64-unknown-linux-gnu: covers Raspberry Pi OS 64-bit and other ARM
# SBCs. cross-rs's default image doesn't ship libasound2-dev for a
# non-host target architecture, so it has to be installed for the target
# arch (arm64) specifically, not the container's own host arch (amd64).
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install --assume-yes libasound2-dev:arm64 git",
]
