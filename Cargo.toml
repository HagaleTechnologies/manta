[workspace]
resolver = "2"
members = [
    "crates/manta-decode",
    "crates/manta-dsp",
    "crates/manta-input",
    "crates/manta-testkit",
    "crates/manta-engine",
    "crates/manta-spot",
    "crates/manta-server",
    "crates/manta-cli",
    "crates/manta-soak-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.98.0"
repository = "https://github.com/HagaleTechnologies/manta"
homepage = "https://github.com/HagaleTechnologies/manta"
keywords = ["cw", "morse", "ham-radio", "sdr", "skimmer"]
categories = ["command-line-utilities", "hardware-support", "network-programming", "multimedia::audio"]

[workspace.dependencies]
manta-decode = { path = "crates/manta-decode" }
manta-dsp = { path = "crates/manta-dsp" }
manta-input = { path = "crates/manta-input" }
manta-testkit = { path = "crates/manta-testkit" }
manta-engine = { path = "crates/manta-engine" }
manta-spot = { path = "crates/manta-spot" }
manta-server = { path = "crates/manta-server" }

coppa-dsp = { git = "https://github.com/HagaleTechnologies/coppa.git", rev = "f8a4d16df7e5776a0756943c05712038774e6c70" }
coppa-audio = { git = "https://github.com/HagaleTechnologies/coppa.git", rev = "f8a4d16df7e5776a0756943c05712038774e6c70" }
coppa-channel = { git = "https://github.com/HagaleTechnologies/coppa.git", rev = "f8a4d16df7e5776a0756943c05712038774e6c70" }

cpal = "0.18"
ctrlc = "3"
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
libc = "0.2"

anyhow = "1.0"
num-complex = "0.4"
smallvec = "1"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
rand_core = "0.10"
rand_chacha = "0.10"
proptest = "1.5"
approx = "0.5"
tempfile = "3"
sha2 = "0.11"
rayon = "1"
tungstenite = "0.30"
rubato = "5.0"
soapysdr = "0.5"
regex = "1"
tokio = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio-tungstenite = "0.30"
toml = "1.1"
toml_edit = "0.25"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

# DSP in debug tests is unusably slow without this; golden V1 runs in seconds.
[profile.dev]
opt-level = 1
# HAR-101: a cold `cargo test --workspace` build wrote a ~16 GB target/debug
# on Linux, most of it full debug info in deps/ plus the incremental cache --
# tens of GB of disk writes per fresh checkout. Line tables keep file:line in
# panic backtraces (all the test suite needs); nothing here reads full
# debuginfo. Incremental caches only pay off on repeated edit-rebuild cycles
# in one checkout, never in fresh/CI checkouts. Tests inherit this profile.
# Local debugging can opt back in: CARGO_PROFILE_DEV_DEBUG=2 CARGO_INCREMENTAL=1.
debug = "line-tables-only"
incremental = false
[profile.dev.package."*"]
opt-level = 2
