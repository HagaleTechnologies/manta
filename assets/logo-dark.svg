<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="manta">
  <title>manta</title>
  <!-- Manta ray, seen from above, skimming over a band: the wings span the
       passband and the spectrum below carries the CW signals it picks out. -->
  <g fill="#e5e7eb">
    <!-- body and wings -->
    <path d="M128 46
             C140 46 150 52 158 60
             C192 68 232 82 250 104
             C234 112 212 116 194 120
             C174 126 160 138 152 158
             L140 182 L116 182 L104 158
             C96 138 82 126 62 120
             C44 116 22 112 6 104
             C24 82 64 68 98 60
             C106 52 116 46 128 46 Z"/>
    <!-- cephalic fins -->
    <path d="M104 56 C100 46 102 36 110 30 C116 34 118 44 118 54 Z"/>
    <path d="M152 56 C156 46 154 36 146 30 C140 34 138 44 138 54 Z"/>
    <!-- tail -->
    <path d="M122 180 L134 180 L130 218 L128 240 L126 218 Z"/>
  </g>
  <!-- spectrum: noise floor plus a few narrow CW carriers -->
  <path fill="none" stroke="#60a5fa" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
        d="M10 226 L22 224 L30 227 L38 222 L46 226
           L52 226 L56 190 L60 226
           L70 224 L78 227 L86 223 L94 226 L102 225
           L108 226 L112 172 L116 226
           L124 224 L132 227 L140 223 L148 226
           L156 225 L160 200 L164 226
           L174 224 L182 227 L190 222 L198 226 L206 225
           L212 226 L216 182 L220 226
           L230 224 L238 227 L246 224"/>
</svg>
