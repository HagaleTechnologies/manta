[package]
name = "manta-cli"
description = "manta daemon and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "manta"
path = "src/main.rs"

[features]
soapy = ["manta-input/soapy"]
hpsdr = ["manta-input/hpsdr"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
# MAN-126: `manta doctor`'s audio check lists sound-card inputs.
coppa-audio = { workspace = true }
ctrlc = { workspace = true }
hound = { workspace = true }
serde_json = { workspace = true }
manta-decode = { workspace = true }
manta-engine = { workspace = true }
manta-input = { workspace = true }
manta-server = { workspace = true }
num-complex = { workspace = true }
serde = { workspace = true }
manta-spot = { workspace = true }
manta-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# MAN-78: SIGTERM, and SIGHUP (reload with a [server] table, drain
# without one); ctrlc keeps SIGINT and Windows' console events.
[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }
# MAN-78: `pthread_sigmask`, to keep a daemon's SIGHUP off the decode thread.
# MAN-126: `manta doctor`'s clock check reads the kernel's NTP-sync state
# with `adjtimex` (Linux only; gated by cfg in clock_check.rs).
libc = { workspace = true }

[dev-dependencies]
coppa-audio = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
manta-dsp = { workspace = true }
manta-testkit = { workspace = true }
tempfile = { workspace = true }
hound = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
tungstenite = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# MAN-268: tests/packaging_examples.rs parses the shipped docker-compose.yml
# as YAML rather than matching text fragments. Test-only; pinned here, not
# in [workspace.dependencies], because no other crate reads YAML.
serde_yaml_ng = "0.10"
