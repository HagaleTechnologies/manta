[package]
name = "manta-cli"
description = "manta daemon and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "manta"
path = "src/main.rs"

[features]
soapy = ["manta-input/soapy"]
hpsdr = ["manta-input/hpsdr"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
serde_json = { workspace = true }
manta-decode = { workspace = true }
manta-engine = { workspace = true }
manta-input = { workspace = true }
manta-server = { workspace = true }
num-complex = { workspace = true }
manta-spot = { workspace = true }
manta-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
coppa-audio = { workspace = true }
serde_json = { workspace = true }
manta-testkit = { workspace = true }
tempfile = { workspace = true }
