# manta configuration file, written by `manta config init`.
#
# Every setting manta reads is listed below, commented out and set to its
# built-in default. To change one, delete the `#` at the start of its line
# and edit the value. A setting left commented out keeps the built-in
# default, including any improved default a later manta release brings.
# A setting marked "no default" shows an example value instead.
#
# Check this file:   manta config check --config manta.toml
# Run with it:       manta run --config manta.toml
#
# A command-line flag overrides this file for one run, and so does a
# MANTA_<TABLE>_<KEY> environment variable such as MANTA_INPUT_FREQ_HZ;
# a flag beats a variable.


# --- Servers -----------------------------------------------------------------
# The DX-cluster telnet server, the JSON Lines / WebSocket spot stream and
# the Prometheus metrics endpoint. `manta run` starts them only when this
# file has a [server] table: delete the `#` in front of [server] and of
# station_callsign, and set your callsign.
#
# With a sound card or a WAV recording as the receiver, `manta run` also
# needs your radio's dial frequency: set center_freq_hz under [input].

#[server]

# Your callsign, sent as the spotter of every spot. No default; required
# whenever [server] is present.
#station_callsign = "N0CALL"

# Shown in the greeting telnet clients and RBN's Aggregator see on
# connect. Optional; each one is left out of the greeting when unset.
#operator_name = "Art"               # your name
#operator_qth = "Richmond Hill, ON"  # your location
#operator_grid = "FN03GW"            # Maidenhead grid square, 4 or 6 characters

# Your station's position, sent with every JSON spot as deGrid, deLat and
# deLon. operator_grid above is enough: spots then carry the centre of the
# grid square. Add operator_lat and operator_lon for an exact point. When
# all three are set, the point must lie inside the grid square. With none
# of them set, JSON spots carry no station position. Decimal degrees;
# south and west are negative.
#operator_lat = 43.9375              # -90 to 90
#operator_lon = -79.4583             # -180 to 180

# Address the telnet and JSON servers listen on. The default, 0.0.0.0,
# accepts connections on every network interface, as a public cluster
# node expects. Set "127.0.0.1" to accept connections from this machine
# only.
#bind_addr = "0.0.0.0"

# Address the metrics endpoint (GET /metrics and GET /healthz) listens
# on, separately from bind_addr. The endpoint has no password, so the
# default, 127.0.0.1, accepts connections from this machine only. Set
# "0.0.0.0" only when a Prometheus server or health probe on another
# machine, or outside this container, must reach it, and firewall
# metrics_port to those machines.
#metrics_bind_addr = "127.0.0.1"

#telnet_port = 7300                  # DX-cluster telnet server
#json_port = 7301                    # JSON Lines and WebSocket spot stream
#metrics_port = 7302                 # Prometheus metrics, GET /metrics

# Live-state stream for dashboards: band noise floor and activity,
# each track's decoded text and candidates, and why each candidate was or
# was not spotted. Off unless live_port is set. No password, and it carries
# every track's decoded text, so the default address accepts connections
# from this machine only; set "0.0.0.0" for a dashboard on another machine
# and firewall live_port to it.
#live_port = 7303                    # live-state stream (JSON Lines/WebSocket)
#live_bind_addr = "127.0.0.1"        # live-state listener address

# Telnet spot-line layout: "rbn" (the Reverse Beacon Network's layout,
# which most loggers read) or "skimmer" (CW Skimmer's own layout, for
# running behind an Aggregator).
#line_format = "rbn"

# Seconds between the one-line status reports in the log; 0 turns them off.
#status_interval_secs = 60

# With two or more [[input]] entries: seconds an input may decode no spots
# for -- while another input does -- before manta warns and sets
# manta_input_silent{source} to 1. 0 turns the check off; otherwise 60 to
# 86400.
#silent_input_warning_secs = 600

# Minutes of spot history a telnet client can replay with sh/dx after it
# connects; a logger fills its band map with "sh/dx 30m". manta always
# keeps the 50 newest spots and never more than 10000, so a very busy band
# can keep less than this. 0 keeps only the 50 newest. 0 to 1440; the
# history starts empty whenever manta starts.
# Also bounds WebSocket resume history: spots and grades together,
# at least the newest 50 records and at most 10,000. Raw TCP never replays.
#history_minutes = 30

# Limits per client IP address; 0 removes a limit. Raise them when clients
# reach manta through a reverse proxy, where they all share its address.
#telnet_max_connections_per_ip = 16  # open telnet connections
#json_max_connections_per_ip = 16    # open JSON and WebSocket connections
#metrics_max_connections_per_ip = 8  # open metrics connections
#telnet_max_commands_per_ip = 30     # telnet commands per 10 seconds
#json_max_pings_per_ip = 10          # WebSocket pings per 60 seconds
#metrics_max_requests_per_ip = 60    # metrics connections per 60 seconds


# --- Uplink to an RBN-style collector ----------------------------------------
# Forwards CQ and beacon spots to an upstream collector. Needs [server].
# Experimental: its login and spot format are unverified against RBN's
# real ingest. To reach RBN today, let an RBN Aggregator read the telnet
# server instead (docs/RUNBOOKS/secondary-skimmer-field-node.md).
# Delete the `#` in front of [[rbn_uplink]] and the settings below to use
# it; repeat the block once per collector.

#[[rbn_uplink]]

#enabled = true                      # no default: whether this uplink connects
#target_host = "<collector-host>"    # no default: the collector's host name
#target_port = 7000                  # no default: <collector-port>
#login_callsign = "N0CALL"           # default: station_callsign from [server]

# true: connect and log in, but send no spots. Set false only once you mean
# to send spots to the collector; going live also needs [server]
# operator_grid set to a 6-character Maidenhead locator (e.g. "FN03ab").
#dry_run = true

# Which spots to send: "cq_beacon" sends only stations calling CQ (or CQ
# TEST) and beacons, as RBN requires; "all" also sends stations answering
# a call (DE) and spots with no recognised context.
#spot_types = "cq_beacon"

# Per-minute ceiling on spots actually written to this target. Over the
# ceiling, spots are counted in manta_uplink_ceiling_suppressed_total and
# skipped -- the connection stays up. 0 disables the ceiling. Restart-only
# (SIGHUP reloads only dry_run).
#max_spots_per_minute = 600


# --- Comparison with the Reverse Beacon Network -------------------------------
# Grades each spot against what RBN's public telnet feed heard within
# window_secs of it, and publishes the grade on the JSON stream and
# /metrics. Needs [server]. manta only reads the feed: it logs in with a
# callsign and sends nothing else.

#[rbn_compare]

#enabled = false                     # --rbn-compare turns it on for one run
#feed_host = "telnet.reversebeacon.net"  # RBN's public telnet feed
#feed_port = 7000                     # RBN's CW and RTTY feed; manta keeps CW only
#login_callsign = "N0CALL"            # default: station_callsign from [server]
#window_secs = 180                    # 30 to 3600; RBN reports this close to a spot count
#freq_tol_hz = 500.0                  # further than this from RBN's modal frequency: frequency disagreement
#speed_tol_wpm = 3.0                  # a speed disagreement needs more than this many WPM
#speed_tol_pct = 20.0                 # and more than this percent of RBN's median speed
#spotters = []                        # only these RBN skimmers count, e.g. ["K5TR"]; --rbn-spotter replaces it
#exclude_spotters = []                # never count these skimmers; your own callsign is always excluded


# --- Relay another skimmer's spots ---------------------------------------------
# Forwards the spots of another CW skimmer on your network (CW Skimmer,
# SkimSrv or a second manta) through [[rbn_uplink]], under that skimmer's own
# call. Only lines the skimmer spotted under `callsign` are forwarded. Needs an
# enabled [[rbn_uplink]]; the uplink's dry_run, spot_types and
# max_spots_per_minute apply. Restart-only. Repeat the block per skimmer.

#[[skimmer_relay]]

#host = "<skimmer-host>"              # no default: the skimmer's host name or address
#port = 7300                          # no default: the skimmer's telnet port
#callsign = "N0CALL-2"                # no default: the call that skimmer spots under
#enabled = true                       # false keeps the block but does not connect


# --- Relay WSJT-X FT8/FT4 decodes ----------------------------------------------
# Listens for WSJT-X/JTDX decodes by UDP (in WSJT-X: Settings > Reporting >
# UDP Server) and forwards new FT8/FT4 CQ decodes through [[rbn_uplink]] as
# digital spots. Anything that can send to `listen` can put spots on the
# uplink under `callsign`, so keep it on 127.0.0.1 unless WSJT-X runs
# elsewhere. Needs an enabled [[rbn_uplink]]. Restart-only.

#[[wsjtx_relay]]

#callsign = "N0CALL"                  # no default: the call these spots go out under
#listen = "127.0.0.1:2237"            # WSJT-X's default UDP server; or a multicast group such as 224.0.0.1:2237
#enabled = true                       # false keeps the block but does not listen


# --- Callsign lookup (QRZ.com) ------------------------------------------------
# Spots only callsigns QRZ.com lists. A call QRZ reports as not found is not
# spotted; a lookup QRZ does not answer within 10 s spots anyway. Answers are
# kept 24 h. Live sources only: a file replay looks nothing up. Calls on
# [spot].allowlist are never looked up. Needs a QRZ.com account; QRZ says its
# XML service needs a Logbook Data subscription beyond testing. Restart-only.

#[callsign_lookup]

#enabled = false                     # true withholds spots whose callsign QRZ.com does not list
#qrz_username = ""                    # your QRZ.com user name; required when enabled
#qrz_password = ""                    # required when enabled; or MANTA_CALLSIGN_LOOKUP_QRZ_PASSWORD
#qrz_url = "https://xmldata.qrz.com/xml/current/"  # https://; http:// only to a loopback test server


# --- Receiver ----------------------------------------------------------------
# With `type` and every receiver setting commented out, manta listens to
# the system's default sound card, or to whatever source the command line
# names. A source flag on the command line (--device, --source,
# --kiwi-host, --soapy-driver, --hpsdr-host) replaces this whole table,
# shared settings included.

[input]

# Receiver type: "audio", "file", "kiwi", "soapy", "hpsdr" or "ka9q". No default.
# Each type reads only its own settings below; "required" ones must be set.
#type = "kiwi"

# This receiver's name in logs, metrics and --input; unset uses its
# type. Several receivers in one daemon: write this table as [[input]] once
# per receiver, each with its own name and type (see docs/CONFIG.md).
#name = "20m"

# type = "audio", a sound card:
#device = "USB Audio"                # no default (the system's default input); part of the device's name

# type = "file", a WAV recording replayed as if live:
#path = "capture.wav"                # required; relative to this file's directory
#iq = false                          # true for a two-channel IQ recording, not mono audio
#realtime = false                    # true to replay at the recording's own pace, so clients can watch (run only)
#loop = false                        # true to replay again from the start each time it ends; implies realtime (run only)
#iq_format = "cf32"                  # headerless little-endian IQ, cf32 or ci16 (needs iq = true and center_freq_hz); omit for WAV or a manta recording
#sample_rate_hz = 96000              # the headerless file's stored sample rate, with iq_format

# type = "kiwi", a KiwiSDR web receiver, and type = "hpsdr", an
# HPSDR/Hermes radio (both inputs are included in every build):
#host = "<your-receiver-host>"       # required for kiwi; optional for hpsdr (omit to discover)
#mac = "02:11:22:33:44:55"           # hpsdr only: pin a discovered radio; cannot be combined with host
#port = 8073                         # default 8073 for kiwi, 1024 for hpsdr, 5004 for ka9q
#protocol = "auto"                   # hpsdr: "auto" asks the radio; "1" (Hermes-Lite 2) or "2" (ANAN) skips asking
#auto_attenuation = false            # hpsdr protocol 2: raise the radio's attenuator on ADC overload, lower it after 10 min quiet
#password = ""                       # kiwi only; leave empty for public receivers

# type = "soapy", a SoapySDR device (needs a manta built with soapy support):
#driver = "driver=rtlsdr"            # required: SoapySDR device arguments
#gain_db = 30.0                      # no default: the device's automatic gain

# Shared by kiwi, soapy and hpsdr:
#freq_hz = 7030000.0                 # required unless bands is set: the receiver's centre frequency, Hz
#bands = ["40m"]                     # instead of freq_hz: "all", bands such as "40m", or centres in kHz such as "7030"
#tuning_range_hz = [0.0, 30000000.0] # with bands: the receiver's tuning range, Hz; bands outside it are skipped
# Optional HPSDR capacity declaration, only on the first input for a radio.
# Shared HL2 receivers are probed at startup; other gateware needs this fallback.
#receivers = 4
#rate_hz = 192000.0                  # required for soapy and hpsdr: sample rate, Hz

# type = "ka9q", a ka9q-radio (radiod) IQ channel over multicast. It reads
# the channel's rate and frequency from radiod; port above is its RTP data port:
#group = "239.101.6.1"               # required: the channel's data group, an IPv4 multicast address or the name in radiod's `data =` line
#ssrc = 14100000                     # no default: the channel to read, needed only when the group carries more than one
#interface = "192.168.1.20"          # no default: local IPv4 address to join on (the kernel's choice, plus 127.0.0.1)

# The settings below apply to any receiver type, or none.

# Oscillator correction for this receiver, parts per million, -1000 to 1000. `manta calibrate` measures it.
#freq_correction_ppm = 0.0

# Your radio's dial frequency, Hz, for a sound card or WAV recording that
# carries no frequency of its own. No default: without it, frequencies are
# audio offsets, and `manta run` with [server] refuses to start.
#center_freq_hz = 14030000.0

# Decimate to this sample rate, Hz, before decoding. No default: decode at
# the receiver's own rate. It must divide that rate by a power of two.
# Decimation narrows the usable passband to the decimator's <= 1 dB trusted
# band (0.4526 x this rate per side): the outer channels are transition
# band, not tracked, and `run`/`soak` say so at startup.
#capture_rate_hz = 48000.0

# WAV replay only: the time, in Unix seconds, that the recording's first
# sample stands for. No default: the file's modification time.
#replay_epoch = 1700000000

# `manta run` only: record this input's IQ while decoding, as little-endian
# complex float32 plus FILE.meta.jsonl. Existing files are never
# overwritten, so a restart needs a new name. No default: no recording.
#record_iq = "captures/session.cf32"


# --- Spot filters ------------------------------------------------------------

[spot]

# Callsigns always spotted, skipping the plausibility checks, for example
# ["W1AW", "K1ABC"]. A non-empty --allowlist replaces this list.
#allowlist = []

# File of callsigns never to spot, one per line; `#` starts a comment.
# Relative to this file's directory. No default.
#blocklist_path = "bad-calls.txt"

# File of frequency ranges never to spot, one low_hz-high_hz range per
# line. Relative to this file's directory. No default.
#notch_path = "notches.txt"

# AD1C's cty.dat country-prefix file, used in place of the copy built into
# manta: a call whose prefix it does not list is not spotted. Download the
# current file from https://www.country-files.com/cty/cty.dat when a new
# prefix is on the air. Relative to this file's directory. Unset: the
# built-in copy. --cty overrides it.
#cty_path = "cty.dat"

# MASTER.SCP known-callsign list, used in place of the copy built into
# manta: a listed call is spotted with more confidence. Download it from
# https://www.supercheckpartial.com/MASTER.SCP. Relative to this file's
# directory. Unset: the built-in copy. --scp overrides it.
#scp_path = "MASTER.SCP"

# Download current copies of cty.dat and MASTER.SCP while `manta run`
# runs from a live receiver: cty.dat every 7 days, MASTER.SCP every day.
# A download is used only if it parses and looks complete; a failed one is
# logged, counted in manta_list_refresh_total and retried in an hour, and
# the copy already in use stays. File replay never downloads. Downloads are
# plain HTTP (port 80) from the two URLs below. Not used for a list that
# cty_path/scp_path or cty_sha256/scp_sha256 sets.
#refresh_lists = false

# Directory for downloaded lists, so a restart starts from the last good
# download instead of the built-in copy. Relative to this file's
# directory. Unset: downloads are kept in memory only.
#list_cache_dir = "/var/cache/manta"

# Where to download cty.dat. Only http:// URLs: manta has no TLS
# support. Point it at a local mirror to share one download.
#cty_url = "http://www.country-files.com/cty/cty.dat"

# Where to download MASTER.SCP, under the same rules as cty_url.
#scp_url = "http://www.supercheckpartial.com/MASTER.SCP"

# Use exactly this version of cty.dat, by the SHA-256 of its bytes (64 hex
# digits, as printed in manta's `lists:` log line). If cty_path is set,
# that file must match and nothing else is tried; otherwise manta looks in
# the built-in copy, then list_cache_dir. It refuses to start if no copy
# matches. A pinned list is never refreshed. --cty-sha256 overrides it.
#cty_sha256 = "e9ff91a3c3ab28c5f7dbcffb4280944a84645ed53d41cb4c68a41f132ee13fd1"

# Use exactly this version of MASTER.SCP, looked up like cty_sha256 (a set
# scp_path must match; otherwise the built-in copy, then list_cache_dir).
# --scp-sha256 overrides it.
#scp_sha256 = "00692208fa86b1498dcd6fc0f88e14d2a1a0462ba5d481855da5de69be4e3cf0"

# How many times a call must repeat before it is spotted, by how common its
# callsign pattern is (the call's first 2-4 characters, then @ for each
# letter and # for each digit, so K5ARH is K5@@@). "normal": 2 for a common
# pattern, 3 for a rare one, 5 for one not in the pattern list. "minimal":
# 2 for every call (manta before 0.2). Allowlisted calls and beacons are
# exempt either way. Changes need a restart.
#validation_level = "normal"

# Callsign-pattern list used in place of the copy built into manta (derived
# from MASTER.SCP). One pattern per line, a leading + marks a common one, `#`
# starts a comment: "+K5@@@". Relative to this file's directory. Unset: the
# built-in copy. --patterns overrides it. Changes need a restart.
#pattern_path = "patterns.lst"


# --- Signal detection --------------------------------------------------------
# When a signal becomes a track that gets decoded, and when the track ends.

[detector]

# Skip the common HF FT8, FT4, WSPR and JS8 windows when starting CW tracks.
# Set false to include these windows. Restart required.
#digital_window_filter = true

#on_snr_db = 12.0                    # signal-to-noise ratio, dB, that starts a track (0 to 100)
#off_snr_db = 3.0                    # ratio below which a track counts as silent (0 to on_snr_db)
#confirm_ms = 50.0                   # how long a signal must last before it is decoded
#hang_ms = 5000.0                    # how long a silent track waits before it closes
#reacquire_ms = 10000.0              # after hang_ms, how long a decoded track keeps its identity waiting for its signal to return; 0 = close at hang_ms
#gc_ms = 30000.0                     # a track that decodes no character this long is closed
#warmup_ms = 25.0                    # start-up time spent measuring the noise; no tracks before it
#track_cap = 1200                    # most open tracks, candidates included
#silent_respawn_cooldown_ms = 30000.0  # wait before a channel whose track went silent starts another
#crash_filter = "full"               # static crashes: "full" ignores them, "starts-only" only blocks new tracks, "off"
#rtty_filter = true                  # recognise RTTY (FSK) signals and start no CW track on them
#rtty_dwell_ms = 20000.0             # how long an FSK signal must last before it is marked as RTTY
#non_cw_filter = true                # decode a track only once it shows CW keying (rejects speech, data, sweeps)
#unkeyed_close_ms = 10000.0          # close a track that stops keying (and read no callsign) after this long


# --- Decoder -----------------------------------------------------------------
# Expert tuning. The defaults are the measured best values; change them
# only to experiment.

[decode]

# "legacy" (the default), "edge-legacy" or "hsmm". hsmm is experimental: it
# did not pass the accuracy and speed checks needed to become the default.
# --engine overrides this.
#engine = "legacy"

# Keying and character decoding, legacy and edge-legacy engines
# (hyst_frac, tau_lo_ms and tau_hi_bounds_ms: legacy only):
#timing_sigma = 0.25                 # timing tolerance when matching dots and dashes
#beam_width = 4                      # character guesses kept at each step
#debounce_ms = 12.0                  # shortest key-down or key-up accepted, ms
#hyst_frac = 0.15                    # keying threshold hysteresis, fraction of keying depth
#tau_lo_ms = 500.0                   # noise-level tracking time constant, ms
#tau_hi_bounds_ms = [100.0, 400.0]   # signal-level tracking time constant, [low, high] ms
#flush_gap_dits = 7.0                # silence, in dot lengths, that ends a word

# Evidence and noise front end, edge-legacy and hsmm engines
# (sigma_u, llr_clip and fallback_hops change hsmm only):
#sigma_u = 0.3                       # keying-edge timing spread
#llr_clip = 10.0                     # cap on per-sample mark/space evidence
#hold_dits = 4.0                     # mark-level hold window, dot lengths
#fallback_hops = 8                   # evidence interval when no keying edge is seen
#noise_window_ms = 1500.0            # noise-floor window, ms
#noise_min_bias_db = 2.16            # noise-floor minimum correction, dB
#spectral_min_bias_db = 1.5          # neighbouring-channel noise correction, dB
#spectral_beta = 0.5                 # weight of the neighbouring-channel noise estimate

# Any engine:
#refine_bw_hz = 0.0                  # narrowband refiner bandwidth before decoding, Hz; 0 = off

# hsmm only:
#dur_sigma = 0.22                    # element-length tolerance
#mark_insert_penalty = -1.5          # penalty against reading noise as an extra element
#beam = 12                           # hypotheses kept per step
#lookahead_dits = 25.0               # how far ahead, in dot lengths, before a character is final
#speed_alpha = 0.2                   # how quickly the speed estimate follows the sender
#seed_units_hops = [9.0, 13.0, 18.0, 26.0, 38.0]  # starting dot lengths tried
#conf_kappa = 6.0                    # confidence scale
