[package]
name = "manta-engine"
description = "Pipeline orchestration: input -> channel -> decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
libc = { workspace = true }
num-complex = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
manta-decode = { workspace = true }
manta-dsp = { workspace = true }
manta-input = { workspace = true }
manta-spot = { workspace = true }

# Windows has no libc::rusage/getrusage (POSIX-only) -- peak_rss_bytes()
# in soak.rs/soak_metrics.rs needs a native equivalent there
# (GetProcessMemoryInfo). Target-gated so it's a no-op dependency on
# every other platform. Found via MAN-21's release pipeline: manta had
# never actually been build-tested on Windows before (ci.yml only runs
# ubuntu-latest/macos-latest), despite README claiming Windows support.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
coppa-audio = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
manta-testkit = { workspace = true }

[[bench]]
name = "cpu_budget"
harness = false
