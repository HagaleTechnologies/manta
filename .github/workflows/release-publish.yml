name: Release Publish

# MAN-21: the actual publish path -- pushes the multi-arch Docker image
# to GHCR and creates the GitHub Release, from a tagged commit.
#
# Deliberately a SEPARATE FILE from release.yml, not a job within it, and
# deliberately has NO `pull_request` trigger anywhere in its `on:` block
# (PR #78 review round 6). Splitting into a second job within the same
# file (the previous approach) is not sufficient on its own: for a
# `pull_request` event, GitHub evaluates the ENTIRE workflow file --
# every job, every `if:`, every `permissions:` block -- from the PR's OWN
# head ref, not the base branch (this is exactly why `pull_request_target`
# exists as the alternative; see wait-for-codex.yml's own header comment
# for this repo's established precedent on the same class of risk). A
# same-repository PR (not subject to the read-only-token restriction that
# only applies to FORK PRs) could therefore edit a job's `if:` condition
# within its own diff and have that edited condition evaluate true for
# its own run, reaching `packages: write` before the PR is ever reviewed.
#
# Keeping the write-capable jobs in a file whose `on:` block never
# includes `pull_request` at all closes the straightforward/accidental
# version of this: today, nothing about a normal PR's `pull_request`
# event can invoke this file, because GitHub only evaluates a workflow
# file's jobs for event types that file's OWN `on:` block declares.
#
# Residual risk (MAN-66), Tony's explicit call 2026-09-12: ACCEPTED, not fully closed.
# `docker-publish-release` below is gated behind the `ghcr-publish` environment (deployment policy
# restricted to the `v*` tag pattern this job already publishes from, no required reviewers --
# see that job's own comment). But a same-repository contributor who already has write access
# could still, within their own PR's diff, add a `pull_request:` trigger to this file AND delete
# or rename the `environment:` line on the same job (Codex P1, manta#193 round 1) -- the gate
# lives in the exact file the attacker already controls. Closing that fully would mean moving the
# publish credential off GITHUB_TOKEN entirely onto a dedicated environment-scoped PAT (GitHub's
# repo-level default-workflow-permissions setting is a FALLBACK for workflows that don't declare
# `permissions:`, not an enforced ceiling -- an explicit `permissions: packages: write` still
# overrides it regardless of the repo default, confirmed via GitHub's own docs before concluding
# this). Deliberately NOT built: at the trust level this requires (an already write-access-holding
# identity going rogue), publishing a rogue image is one of the LESS damaging things available to
# it -- the same identity could already exfiltrate any other repo secret via a new job, or (for the
# two installed integrations that are also ruleset bypass actors) skip code review entirely. Not
# worth this file's own complexity to harden one narrow downstream symptom of that broader
# question. No human collaborators exist on this repo today besides Tony; several GitHub App
# installations (claude, chatgpt-codex-connector, mergify, catalyst-cloud-connector, linear-code,
# semgrep-code-hagaletechnologies) hold the necessary contents:write/workflows:write scope
# org-wide -- worth an actual permissions audit of those if this risk class matters more later,
# not a redesign of this one file.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the Docker image to GHCR (never creates a GitHub Release -- that only ever happens from a real v* tag push)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: manta

concurrency:
  group: release-publish-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: manta-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: manta-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: manta-windows-x86_64
            exe_ext: .exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: manta-linux-x86_64
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: manta-linux-arm64
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release -p manta-cli --features hpsdr --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release -p manta-cli --features hpsdr --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dist="dist/${{ matrix.artifact }}"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.exe_ext }}" "$dist/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dist/" 2>/dev/null || cp README.md "$dist/"
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:BIN_NAME}${{ matrix.exe_ext }}" $dist
          Copy-Item README.md $dist
          if (Test-Path LICENSE-MIT) { Copy-Item LICENSE-MIT $dist }
          if (Test-Path LICENSE-APACHE) { Copy-Item LICENSE-APACHE $dist }
          Compress-Archive -Path $dist -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore
          retention-days: 14

  # Split into two mutually-exclusive jobs (Codex P2, manta#193 round 1): the original single
  # job's `environment: ghcr-publish` blocked EVERY run on a non-`v*` ref, including the
  # legitimate `workflow_dispatch` "test push" path this file's own comments describe (targeting
  # any branch, pushing a uniquely-tagged image, never `:latest`). That dispatch path isn't
  # reachable by an attacker's own automatic PR-triggered run at all -- it requires a deliberate,
  # separate manual trigger by someone who already has write access -- so gating it added no real
  # protection against the threat model MAN-66 describes while breaking a real, supported use
  # case. Only the real `push: tags: v*` path is gated now.
  docker-publish-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # MAN-66 (accepted risk, see this file's header comment for the full reasoning): gates the
    # real release-publish path behind `ghcr-publish`'s tag-only deployment policy -- a PR branch
    # ref never matches `v*`, so this job can't run (or obtain `packages: write`) on a
    # PR-triggered ref regardless of what trigger a PR's diff adds, UNLESS that same diff also
    # strips this `environment:` line, which round 1 confirmed isn't fully closed here.
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine version, image, and tag list
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # OCI/Docker repository paths must be lowercase; github.repository
          # is case-preserving ("HagaleTechnologies/manta") and buildx
          # rejects a mixed-case tag outright.
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<RELEASE_TAGS_EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:latest"
            echo "RELEASE_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}

  # Ungated, deliberately: this only ever runs from a manual `workflow_dispatch` (any ref) --
  # never automatically from a PR event -- so it isn't reachable by the threat model MAN-66
  # describes, and gating it behind `ghcr-publish`'s tag-only policy would incorrectly block the
  # dry-build (`publish=false`, any ref) and test-push (`publish=true`, targeting a branch) paths
  # this job exists to support.
  docker-build-dispatch:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine version, image, and tag list
        id: version
        shell: bash
        run: |
          VERSION="dispatch-${{ github.run_id }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          # `:latest` is reserved for real tag pushes only (docker-publish-release) -- a
          # workflow_dispatch run with publish=true can target any branch, not just a release,
          # and README's `docker run ghcr.io/.../manta:latest` install command must always trace
          # to a real tagged release, not a manual test build that happened to also push.
          {
            echo "tags<<RELEASE_TAGS_EOF"
            echo "$IMAGE:$VERSION"
            echo "RELEASE_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish == true }}
          tags: ${{ steps.version.outputs.tags }}

  release:
    needs: [build, docker-publish-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: find dist -type f

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
