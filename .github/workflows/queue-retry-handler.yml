name: Queue Retry Handler

# Fleet CI redesign, Phase 2 (manta) -- direct port of widdershins'
# queue-retry-handler.yml (22 Codex review rounds on that repo; see
# HagaleTechnologies/widdershins#417), adapted for manta's Rust workspace
# and its own required-check names. GitHub's native merge queue dequeues a
# PR on a merge-group CI failure, but also fully disarms auto-merge -- and
# nothing else re-arms it, since auto-merge-trigger.yml and
# dependabot-auto-merge.yml only fire on discrete PR-lifecycle events,
# none of which occur just because a merge-group check completed. A PR can
# sit open indefinitely, silently, with clean PR-level status. This
# handler allows exactly ONE automatic retry per PR head SHA, then hands
# off to a human with a visible signal if that retry also fails -- never
# an unbounded loop. It never touches code, dispatches tests directly, or
# deploys; its only mutating action is re-arming auto-merge on the PR's
# own already-reviewed candidate, re-requesting admission through the same
# gate that independently re-verifies everything from scratch.
#
# No separate helper script (unlike widdershins' scripts/queue-retry-lib.mjs):
# manta has no existing Node/vitest toolchain (it's a Cargo workspace; its
# own scripts/ directory is all bash), and the two functions that file held
# -- a branch-name regex parse and a one-line ternary -- are trivial enough
# to inline directly in bash below without introducing a second language's
# test infrastructure into this repo for their sake.
#
# workflow_run, not check_run: GitHub does not fire check_run/check_suite
# events for a check suite that Actions itself created (anti-recursion) --
# every check in this repo is Actions-created, so check_run would never
# fire here, for any of them, ever.
on:
  workflow_run:
    # CI and Supply Chain (manta#190) -- "Wait for Codex Review" is a deliberate pass-through on
    # merge_group (it never re-reviews a synthetic integration commit, so it structurally can't
    # fail there) and is intentionally excluded. Supply Chain added here (Codex P1, manta#190
    # round 1) BEFORE it's wired as a required check itself -- once main-protection's
    # required_status_checks lists it, a merge-group failure there disarms auto-merge exactly
    # like a CI failure does, and this handler needs to already be listening or that failure gets
    # neither an automatic retry nor a needs-human handoff, leaving the PR silently open.
    workflows: ['CI', 'Supply Chain']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  handle-merge-group-failure:
    # Only merge-group-triggered CI runs that didn't succeed. Includes
    # `cancelled`: manta's own ci.yml concurrency group keys merge_group/push
    # runs on github.run_id (never a shared PR-number group), so a sibling
    # run can't cancel this one structurally -- but an external cancel
    # (manual, a repo-wide event) still disarms auto-merge exactly the same
    # way a real test failure does, so it's handled identically here. Also
    # includes `timed_out`: ci.yml's test/test-soapy/test-hpsdr jobs carry
    # no explicit `timeout-minutes` of their own, so a genuinely hung run
    # (a wedged runner, a decoder stuck against real hardware) reaches
    # GitHub Actions' own platform-default job timeout rather than any
    # timeout this repo controls -- workflow_run still reports that as
    # `conclusion: timed_out`, and auto-merge is disarmed exactly the same
    # as a real failure. Omitting it would leave a timed-out merge-group
    # attempt permanently stuck: neither retried nor handed off to a human,
    # for the one failure mode (a hang) this handler exists to catch. Also
    # includes `startup_failure` (Codex round 4): a run can fail to even
    # start (a runner-provisioning problem, an invalid workflow file on
    # that specific ref) and GitHub reports that conclusion distinctly from
    # `failure` -- the queue attempt still cannot merge, and auto-merge is
    # still disarmed, so it needs the identical retry-or-handoff treatment.
    # A plain PR-triggered CI failure is the PR author's own problem to
    # push a fix for, not something this handler touches.
    if: |
      github.event.workflow_run.event == 'merge_group' &&
      (
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'cancelled' ||
        github.event.workflow_run.conclusion == 'timed_out' ||
        github.event.workflow_run.conclusion == 'startup_failure'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialize per merge-group attempt (recovered from the branch name
    # below). Only one required check (CI) triggers this workflow on
    # manta, so there's no sibling-required-check race to serialize
    # against the way widdershins' CI+Supply-Chain pair needed -- kept
    # anyway as a cheap safeguard against GitHub redelivering the same
    # workflow_run event, and to match the attempt-level dedup step below.
    concurrency:
      group: queue-retry-handler-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # Needed so the "Retry once" step below can invoke its own script body from
      # scripts/ (see that step's own comment for why it's a checked-out file instead
      # of an inline run: block, matching this repo's own existing scripts/ convention
      # rather than introducing a separate .github/scripts/ directory). `ref:` explicitly
      # pinned to the default branch, not left to actions/checkout's own default (which
      # for a workflow_run event
      # resolves to github.event.workflow_run.head_sha -- the merge-group's own synthetic
      # commit, not a ref this job should be trusting for its own script content): this
      # workflow's entire trust model already rests on workflow_run always running the
      # BASE branch's workflow definition (the same guarantee pull_request_target relies
      # on), and the script file is exactly as trusted as the workflow YAML itself --
      # checking out anything else here would be a narrower trust boundary than every
      # other line in this file already assumes.
      - name: Checkout (for the retry step's own script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Parse PR number from the merge-group branch name
        id: parse
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # GitHub's merge-group synthetic branch naming convention:
          #   gh-readonly-queue/<base>/pr-<number>-<baseShaAtEnqueue>
          # The trailing SHA is the BASE branch's commit at enqueue time,
          # NOT the PR's own head -- deliberately not captured below, so
          # nothing downstream can mistake it for the PR's revision
          # identity (this exact confusion was a real, verified-against-git-
          # history bug on widdershins' first build of this handler).
          if [[ "$HEAD_BRANCH" =~ ^gh-readonly-queue/([^/]+)/pr-([0-9]+)-[0-9a-f]+$ ]]; then
            pr_number="${BASH_REMATCH[2]}"
          else
            echo "::error::Could not parse merge-group branch name: $HEAD_BRANCH -- not a merge-group ref, or the naming convention changed. Exiting without action."
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Fetch the PR's real head SHA and determine whether it's safe to act
        id: pr-state
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.parse.outputs.pr_number }}
        run: |
          # The merge-group branch name's trailing SHA is the BASE branch's commit at enqueue
          # time, NOT the PR's own head (see the parse step above) -- and the merge-group's own
          # synthetic commit doesn't help either: under this ruleset's SQUASH merge_method, that
          # synthetic commit has exactly one parent, so the PR's actual head can't be recovered
          # from it. Fetch the PR's actual current head SHA from the API instead of trusting
          # anything derived from the branch name or the merge-group commit.
          #
          # No timestamp-based "was this superseded" heuristic: every timestamp source is
          # unreliable in a different way -- the head commit's own committer date is
          # pusher-controlled (a force-pushed, rebased commit can carry an old original
          # timestamp), and the PR's updatedAt is self-referential: this very workflow's OWN
          # actions (dequeuing disarms auto-merge; a successful retry posts a comment and adds a
          # label) bump updatedAt themselves, so a normal run could poison its own next staleness
          # check. It isn't needed anyway: the retry-budget label below is already scoped to the
          # PR's CURRENT head SHA, fetched fresh right here -- if a newer push landed, that new
          # SHA simply gets its own fresh retry budget, which is correct, not a bug -- UNLESS the
          # current head was never actually the one that failed (see the autoMergeRequest check
          # below). Four checks are load-bearing: the PR must still be open, not a draft, its base
          # must still be main (auto-merge-trigger.yml/dependabot-auto-merge.yml only auto-merge
          # into main; other bases lack equivalent required checks), and auto-merge must not
          # already be armed on the current head.
          pr_json=$(gh pr view "$PR" --repo "${{ github.repository }}" --json state,headRefOid,baseRefName,isDraft,autoMergeRequest,author)
          pr_state=$(echo "$pr_json" | jq -r .state)
          head_sha=$(echo "$pr_json" | jq -r .headRefOid)
          base_ref=$(echo "$pr_json" | jq -r .baseRefName)
          is_draft=$(echo "$pr_json" | jq -r .isDraft)
          auto_merge_armed=$(echo "$pr_json" | jq -r '.autoMergeRequest != null')
          # Captured for the retry step below (Codex P1 round 3): it needs to know whether
          # this PR's author is one of auto-merge-trigger.yml's two trusted, bypass-eligible
          # authors before deciding which credential is safe to re-arm with.
          author_login=$(echo "$pr_json" | jq -r .author.login)
          echo "author_login=$author_login" >> "$GITHUB_OUTPUT"

          # Debounce before trusting a "disarmed" reading: the check above only catches the race
          # if auto-merge-trigger.yml's own SEPARATE pull_request_target synchronize handler has
          # ALREADY finished re-arming a freshly-pushed head by the time we check -- there's no
          # ordering guarantee between these two independently-triggered workflows, so a
          # "disarmed" reading here doesn't yet prove the fetched head is the one that actually
          # failed; the synchronize run for a brand-new push may simply still be queued. Re-check
          # once after a short wait: if the head changed, or auto-merge became armed in the
          # meantime, that's definitive proof of the race -- stand down via the same branch below.
          # This narrows the window; it does NOT close it (an exceptionally slow or backlogged
          # synchronize run could still land after this second check too) -- bounded to a single
          # missed automatic retry, not an unsafe merge (same accepted residual as widdershins'
          # HAG-41).
          if [ "$pr_state" = "OPEN" ] && [ "$auto_merge_armed" != "true" ]; then
            sleep 10
            pr_json2=$(gh pr view "$PR" --repo "${{ github.repository }}" --json headRefOid,autoMergeRequest)
            head_sha2=$(echo "$pr_json2" | jq -r .headRefOid)
            auto_merge_armed2=$(echo "$pr_json2" | jq -r '.autoMergeRequest != null')
            if [ "$head_sha2" != "$head_sha" ] || [ "$auto_merge_armed2" = "true" ]; then
              auto_merge_armed=true
            fi
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha12=$(echo "$head_sha" | cut -c1-12)" >> "$GITHUB_OUTPUT"

          if [ "$pr_state" != "OPEN" ]; then
            echo "::notice::PR #$PR is no longer OPEN ($pr_state) -- nothing to act on."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$auto_merge_armed" = "true" ]; then
            # This handler only ever runs on a merge-group CI FAILURE, and GitHub itself always
            # disarms auto-merge the instant that happens -- so by the time this step runs,
            # auto-merge should ALWAYS read disarmed for the head that actually failed. Finding it
            # still armed means the head we just fetched is NOT the one that failed: a contributor
            # pushed a new commit between the failing merge-group run starting and this fetch,
            # auto-merge-trigger.yml's own synchronize handler already re-armed the brand-new
            # (never-tested) head, and `--match-head-commit` alone can't catch this because
            # HEAD_SHA and the merge call would both read the SAME (new, untested) value -- there's
            # no mismatch to detect. Consuming this head's retry budget for a failure that was
            # never actually ITS failure would mean its real first failure later gets misread as a
            # second one and skipped. Standing down is always correct here: either this is that
            # race (nothing to do, the new head hasn't failed anything yet) or a sibling event
            # already retried it (also nothing to do).
            #
            # This assumption depends on auto-merge-trigger.yml never re-arming the SAME
            # (unchanged) head for an unrelated reason (Codex round 9 found exactly that: its
            # `edited` trigger type used to fire -- and call `gh pr merge --auto` -- on ANY PR
            # edit, not just a base retarget, which could re-arm an unchanged already-failed
            # head and let this branch wrongly treat a genuine same-head failure as stale,
            # never consuming its retry budget). Fixed at the source in
            # auto-merge-trigger.yml -- `edited` there now only re-arms when the base branch
            # itself actually changed, the one case that trigger type was ever added for, and
            # a PR whose base just changed onto main can't have any prior main-targeting
            # merge-group failure to preserve a budget for in the first place.
            echo "::notice::Auto-merge is already armed for PR #$PR's current head ($(echo "$head_sha" | cut -c1-12)) -- this can't be the revision that just failed (GitHub disarms auto-merge on every merge-group failure), so a newer push must have landed before this fetch, or a sibling event already retried it. Nothing to act on."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$is_draft" = "true" ]; then
            # Converting the PR to draft is this design's own intentional-pause mechanism -- state
            # stays OPEN and base stays unchanged, so without this check the handler would proceed
            # straight to `gh pr merge --auto`, which GitHub refuses for a draft PR. That refusal
            # would otherwise fall into the same-head "genuine failure" branch below and page a
            # human for what is actually a deliberate, expected pause.
            echo "::notice::PR #$PR was converted to draft -- draft PRs can't be merged, and this is expected (an intentional pause, not a failure). Nothing to act on."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$base_ref" != "main" ]; then
            echo "::notice::PR #$PR's base is '$base_ref', not main -- auto-merge-trigger.yml/dependabot-auto-merge.yml would refuse this base too. Nothing to act on."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deduplicate -- has this exact merge-group attempt already been handled?
        id: dedup
        if: steps.pr-state.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.parse.outputs.pr_number }}
          # workflow_run.head_sha is the merge-group's own synthetic commit SHA -- stable for a
          # single attempt, unlike the PR's own head SHA which stays constant across DIFFERENT
          # attempts. This is the correct dedup key for "was this specific attempt already
          # processed," distinct from the retry-budget label's PR-head-SHA key.
          MERGE_GROUP_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # 12-char short SHA: the full 40-char SHA would push "queue-attempt-handled:" (22 chars)
          # + 40 over GitHub's 50-character label-name limit, silently breaking label creation.
          # Matches the 12-char convention used for the retry-used label elsewhere in this file.
          #
          # Read-only here, not written: this step used to write the marker too, immediately after
          # this check -- but if a LATER step (check-retried, decide, retry, handoff) then failed
          # (a transient API error, say), the attempt would already be permanently marked handled
          # despite never actually being retried or handed off, recreating the exact silent stall
          # this whole handler exists to repair. The write happens in the final "Mark this
          # merge-group attempt as handled" step below, only once the retry or handoff step has
          # actually completed. Writing late instead of early is safe: this job's own concurrency
          # group (cancel-in-progress: false, keyed on head_branch) already serializes any
          # redelivered/duplicate workflow_run events for the SAME attempt.
          ATTEMPT_LABEL="queue-attempt-handled:$(echo "$MERGE_GROUP_SHA" | cut -c1-12)"
          echo "attempt_label=$ATTEMPT_LABEL" >> "$GITHUB_OUTPUT"
          existing=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name' | sort -u)
          # Here-string, not `echo | grep -q`: the default Actions shell runs with `pipefail`, so
          # piping a LIVE, still-paginating `gh api` process straight into `grep -q` is unsafe --
          # if the marker appears early enough that grep exits before gh api has finished writing
          # later pages, gh api gets SIGPIPE'd, and pipefail reports the PIPELINE's exit status as
          # that failure rather than grep's own success. A command substitution fully drains its
          # subshell before returning, so grepping the captured string afterward can't hit this race.
          if grep -qxF "$ATTEMPT_LABEL" <<< "$existing"; then
            echo "::notice::This merge-group attempt ($MERGE_GROUP_SHA) was already handled -- skipping to avoid double-counting the retry."
            echo "already_handled=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_handled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this exact revision already used its one retry
        id: check-retried
        if: steps.pr-state.outputs.stale == 'false' && steps.dedup.outputs.already_handled == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.parse.outputs.pr_number }}
          LABEL: queue-retry-used:${{ steps.pr-state.outputs.head_sha12 }}
          HEAD_SHA12: ${{ steps.pr-state.outputs.head_sha12 }}
        run: |
          # --paginate: the labels endpoint defaults to 30 per page. A PR with more labels than
          # that would otherwise silently read this specific label as absent even when applied,
          # losing the one-retry bound entirely.
          existing=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name' | sort -u)
          if grep -qxF "$LABEL" <<< "$existing"; then
            echo "already_retried=true" >> "$GITHUB_OUTPUT"
          else
            # Comment-marker fallback: if label CREATION itself is broadly broken -- not just this
            # specific label, but new SHA-scoped labels in general -- the retry step's own
            # fail-closed disarm can succeed at disarming and commenting while STILL failing to
            # record queue-retry-used. Without this fallback, a redelivered event (or a rerun)
            # would read "not yet retried," undo that deliberate disarm, and re-arm -- and if the
            # label outage persists, that new attempt disarms again, and the NEXT event re-arms
            # again: an unbounded loop, exactly the failure mode this whole handler exists to
            # prevent. The retry step embeds a machine-readable marker in its own fail-closed
            # comment (posted via `gh pr comment`, which doesn't require creating any new label
            # and so keeps working even when label creation is broken) -- fall back to scanning
            # recent comments for it when the label itself can't be found.
            #
            # Restrict to comments from this workflow's own identity: without this, ANY commenter
            # on the PR could post the predictable marker string for the PR's current short SHA
            # and force a genuine first failure straight into human handoff, denying the retry it
            # should have gotten -- this is retry STATE, not just notification text, so it needs
            # the same trust boundary a label would have gotten for free. Every marker-carrying
            # comment in this file is posted with GH_TOKEN=READ_TOKEN (github.token), which always
            # posts as "github-actions[bot]".
            #
            # Captured into a variable before matching, not `echo | grep -q`: same SIGPIPE-vs-
            # pipefail risk as the dedup step above, and `echo` performing its own write() can
            # still be SIGPIPE'd by an early-exiting grep even after the producing command is
            # fully drained -- a bash pattern match (`[[ == * * ]]`) spawns no second process, so
            # there's nothing for pipefail to misreport.
            comment_bodies=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
            marker="<!-- queue-retry-handler:no-more-retries sha=$HEAD_SHA12 -->"
            if [[ "$comment_bodies" == *"$marker"* ]]; then
              echo "::notice::queue-retry-used label absent for commit $HEAD_SHA12, but a prior fail-closed comment already declared its retry budget spent -- treating as already retried rather than re-arming."
              echo "already_retried=true" >> "$GITHUB_OUTPUT"
            else
              echo "already_retried=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Decide retry vs. handoff
        id: decide
        if: steps.pr-state.outputs.stale == 'false' && steps.dedup.outputs.already_handled == 'false'
        env:
          ALREADY_RETRIED: ${{ steps.check-retried.outputs.already_retried }}
        run: |
          # Exactly one automatic retry per head SHA -- never a second one. This is the single
          # place that policy lives, so it can't drift out of sync between the label-check above
          # and the actual action taken below.
          if [ "$ALREADY_RETRIED" = "true" ]; then
            action=handoff
          else
            action=retry
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Retry once -- re-arm auto-merge FIRST, only label as used once that succeeds
        id: retry
        if: steps.pr-state.outputs.stale == 'false' && steps.dedup.outputs.already_handled == 'false' && steps.decide.outputs.action == 'retry'
        # Body lives in scripts/queue-retry-handler-retry.sh, not inline here
        # (Codex/fleet finding, 2026-09-14): GitHub hard-caps any `run:` block that
        # contains a `${{ }}` expression at 21,000 characters, evaluated as the block's
        # ENTIRE text -- including every comment. This step's own inline body had grown
        # to 23,630 chars from repeated review-round comments, past that cap. GitHub
        # doesn't reject that at push time or via actionlint; it silently rejects the
        # WHOLE workflow file as invalid on every trigger, with no job ever created --
        # confirmed live: `gh api .../actions/workflows/queue-retry-handler.yml/runs
        # ?event=workflow_run` read `total_count: 0` for this repo, every run showed
        # `event: push` (its real trigger, workflow_run, never appears), the run's own
        # `name` was the raw file path instead of `name: Queue Retry Handler`, and
        # every one concluded `failure` with no runner ever provisioned (`gh run view
        # --log-failed` reports "log not found" because there was no job to log). The
        # only place the real reason appears is a UI-only annotation on the run page:
        # "Invalid workflow file ... Exceeded max expression length 21000." This
        # handler's entire "one retry then hand off to needs-human" safety net had
        # therefore never actually executed since it was added -- every merge-group
        # failure just silently dequeued and disarmed auto-merge with no retry and no
        # human notification. A checked-out script file has no such cap (GitHub only
        # measures the run: block's own text), so the script keeps every comment this
        # step's own review history already earned -- only $REPO changed inline, moved
        # to env: like every other value here, so the run: block below carries zero
        # `${{ }}` expressions and can never trip this cap again regardless of how much
        # the script itself grows.
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.parse.outputs.pr_number }}
          LABEL: queue-retry-used:${{ steps.pr-state.outputs.head_sha12 }}
          HEAD_SHA12: ${{ steps.pr-state.outputs.head_sha12 }}
          HEAD_SHA: ${{ steps.pr-state.outputs.head_sha }}
          AUTHOR_LOGIN: ${{ steps.pr-state.outputs.author_login }}
        run: scripts/queue-retry-handler-retry.sh

      - name: Second failure on this exact revision -- hand off, do not retry again
        id: handoff
        if: steps.pr-state.outputs.stale == 'false' && steps.dedup.outputs.already_handled == 'false' && steps.decide.outputs.action == 'handoff'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.parse.outputs.pr_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ steps.pr-state.outputs.head_sha }}
          HEAD_SHA12: ${{ steps.pr-state.outputs.head_sha12 }}
        run: |
          # Revalidate the head before labeling a second failure (Codex P2 round 3): pr-state
          # captured HEAD_SHA well before this step runs (dedup and check-retried each take
          # their own API round-trips in between) -- a new commit landing in that gap gets its
          # own fresh retry budget on its own eventual merge-group run, same as every other
          # race in this file, but WITHOUT this check, this step would attach needs-human to
          # the PR unconditionally: auto-merge-trigger.yml's live-label guard (round 2) would
          # then refuse to arm the replacement revision, incorrectly stalling a commit that has
          # never actually failed the queue itself. Retry's own analogous checks (base changed,
          # head moved) already guard against this same class of race; handoff needed the same.
          current_head_sha=$(gh pr view "$PR" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)
          if [ "$current_head_sha" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$PR's head moved from $HEAD_SHA12 to ${current_head_sha:0:12} since pr-state ran -- the second-failure handoff for the OLD commit is moot; standing down without labeling the replacement revision."
            exit 0
          fi

          # Label first, THEN the marker comment -- reversed from an earlier version of this
          # step (Codex round 6): every staleness checker only trusts a marker whose timestamp
          # is AT OR AFTER the label's own most recent `labeled` timeline event (round 5's fix
          # for a different bug). Posting the marker comment BEFORE the label attach guaranteed
          # the marker would always predate that event, so the staleness check could never
          # treat it as trustworthy -- the corrected revision would stay paused FOREVER even
          # after the author pushes the exact fix this comment asks for, the opposite of round
          # 4/5's intent. Attach and verify the label first; only post the marker once the label
          # is confirmed present, so its timestamp is provably at or after the labeling event.
          #
          # Verify the needs-human label actually attached: `|| true` would let this step report
          # success even if the label doesn't exist (deleted) or the POST fails transiently -- and
          # the "Mark this merge-group attempt as handled" step below only checks that THIS step's
          # conclusion was 'success', not that its label actually landed. Without this, the
          # handoff would be silently marked complete while the one signal meant to get a human's
          # attention never reached anyone. Fail the step (not just warn) so mark-handled's gate on
          # `steps.handoff.conclusion == 'success'` correctly withholds the dedup marker, leaving
          # this attempt eligible for a rerun to actually deliver the signal.
          gh label create needs-human --color d73a4a \
            --description "Needs a human decision -- an automated handler could not safely proceed" \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || true
          gh api --method POST "repos/${{ github.repository }}/issues/${PR}/labels" -f "labels[]=needs-human" >/dev/null 2>&1 || true
          existing_labels=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name')
          attached=$(grep -qxF "needs-human" <<< "$existing_labels" && echo true || echo false)
          if [ "$attached" != "true" ]; then
            echo "::error::Could not attach needs-human to PR #$PR (commit $HEAD_SHA12) -- failing this step so the attempt isn't marked handled."
            exit 1
          fi

          # Disarm any concurrently re-armed auto-merge (Codex round 8): a trusted-author
          # `edited` run of auto-merge-trigger.yml (or dependabot-auto-merge.yml) can complete
          # AFTER pr-state read autoMergeRequest as disarmed but BEFORE this step attached
          # needs-human above -- since the head hasn't changed, that concurrent run's own
          # live-label check (round 2/5) still read needs-human as absent at the time it ran
          # and legitimately re-armed the SAME unchanged revision. needs-human guards FUTURE
          # workflow runs, but doesn't retroactively cancel an auto-merge request already in
          # flight -- without this recheck, the second-failure PR could still merge (or enter a
          # third queue attempt) despite being handed off, defeating this step's entire purpose.
          # Fail the step (not just warn) if disarming can't be confirmed, same as every other
          # safety-critical verification in this file -- mark-handled's gate on
          # `steps.handoff.conclusion == 'success'` then correctly withholds the dedup marker.
          still_armed=$(gh pr view "$PR" --repo "${{ github.repository }}" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$still_armed" = "true" ]; then
            echo "::notice::Auto-merge was concurrently re-armed for PR #$PR (commit $HEAD_SHA12) between pr-state's check and this handoff -- disarming it now that the PR has been handed off to a human."
            gh pr merge "$PR" --repo "${{ github.repository }}" --disable-auto >/dev/null 2>&1 || true
            still_armed_after=$(gh pr view "$PR" --repo "${{ github.repository }}" --json autoMergeRequest --jq '.autoMergeRequest != null')
            if [ "$still_armed_after" = "true" ]; then
              echo "::error::Auto-merge is STILL ARMED for PR #$PR (commit $HEAD_SHA12) despite the disable-auto call -- this handoff's 'no more retries' guarantee cannot be relied on until this is fixed by hand. Failing this step so the attempt isn't marked handled."
              exit 1
            fi
          fi

          # `|| true` on the comment itself: this is a best-effort notification (and the
          # staleness marker it carries degrades safely to "provenance unconfirmed" if it's
          # ever lost, per round 5's fail-closed design) -- a transient failure here shouldn't
          # fail this whole step now that the label itself, the actual fail-closed signal, is
          # already confirmed attached above.
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "Merge-group CI failed again for commit \`$HEAD_SHA12\` after its one automatic retry ([run]($RUN_URL)). Not retrying again -- this needs a human decision: push a fix, or investigate and manually re-run \`gh pr merge --auto --squash\` if it's a known flake.
          <!-- queue-retry-handler:needs-human sha=$HEAD_SHA12 -->" || true

      - name: Mark this merge-group attempt as handled
        # This write only runs now that the retry or handoff step has actually completed (see the
        # "Deduplicate" step above for why it's here rather than written early). `always()` is
        # required because a job-ending failure in an earlier step (e.g. check-retried's label
        # read) would otherwise skip this step too by GitHub Actions' default -- but the explicit
        # conclusion checks below still correctly gate it off in that case, since retry/handoff
        # itself would then show as 'skipped', not 'success'.
        if: |
          always() &&
          steps.pr-state.outputs.stale == 'false' &&
          steps.dedup.outputs.already_handled == 'false' &&
          (steps.retry.conclusion == 'success' || steps.handoff.conclusion == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.parse.outputs.pr_number }}
          ATTEMPT_LABEL: ${{ steps.dedup.outputs.attempt_label }}
          HEAD_SHA: ${{ steps.pr-state.outputs.head_sha }}
          HEAD_SHA12: ${{ steps.pr-state.outputs.head_sha12 }}
        run: |
          # Fail closed on a failed attach: it's NOT harmless. If this job just retried
          # (queue-retry-used label now attached) and THIS marker fails to attach, a redelivered
          # event for the SAME attempt reads dedup as "not yet handled" and falls through to
          # check-retried, which finds the retry-used label THIS job just wrote and reads it as
          # "already retried in a PAST attempt," reaching the "second failure" handoff path before
          # the actual retry has even had a chance to run. check-retried alone cannot distinguish
          # "a redelivery of this same attempt" from "retried in a prior attempt" -- the attempt
          # marker is the ONLY thing that disambiguates those two cases, so losing it isn't
          # degraded observability, it's lost correctness. Disarm and hand off directly from here
          # instead, same idiom the retry step above already uses for its own label: if the state
          # can't be reliably recorded, don't leave it for a differently-timed event to
          # misinterpret.
          attach_ok=false
          gh label create "$ATTEMPT_LABEL" --color ededed \
            --description "This merge-group attempt already triggered the queue retry handler" \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || true
          if gh api --method POST "repos/${{ github.repository }}/issues/${PR}/labels" -f "labels[]=$ATTEMPT_LABEL" >/dev/null 2>&1; then
            existing_labels=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name')
            attached=$(grep -qxF "$ATTEMPT_LABEL" <<< "$existing_labels" && echo true || echo false)
            [ "$attached" = "true" ] && attach_ok=true
          fi

          if [ "$attach_ok" != "true" ]; then
            # Recheck head/base before disarming: the retry step's own two no-op stand-down
            # branches (base changed; head moved) both complete with conclusion 'success' despite
            # performing NO mutation at all -- they're still "success" because standing down IS
            # the correct handling for that attempt, not a failure. mark-handled's gate only
            # checks that conclusion, so it runs here too, and an unconditional `--disable-auto`
            # in that scenario would disarm auto-merge on the PR's CURRENT (superseded) revision
            # -- one auto-merge-trigger.yml's own synchronize handler may have legitimately armed
            # for entirely unrelated reasons that have nothing to do with this stale failure. Only
            # disarm if the PR is still the same revision this job was actually processing.
            current_head=$(gh pr view "$PR" --repo "${{ github.repository }}" --json headRefOid,baseRefName)
            current_head_sha=$(echo "$current_head" | jq -r .headRefOid)
            current_base_ref=$(echo "$current_head" | jq -r .baseRefName)
            if [ "$current_head_sha" != "$HEAD_SHA" ] || [ "$current_base_ref" != "main" ]; then
              echo "::notice::PR #$PR's head or base changed since this job started (now ${current_head_sha:0:12}/$current_base_ref) -- this attempt is moot; standing down without touching auto-merge on the replacement revision."
              exit 0
            fi
            echo "::error::Attempt-dedup label $ATTEMPT_LABEL failed to attach for PR #$PR (commit $HEAD_SHA12) -- disarming auto-merge and handing off instead of risking a redelivered event misreading this as a second failure."
            gh pr merge "$PR" --repo "${{ github.repository }}" --disable-auto >/dev/null 2>&1 || true

            # Verify the disarm actually took (same reasoning as the retry step's own version of
            # this check): don't trust the disable-auto call's own reported success.
            still_armed=$(gh pr view "$PR" --repo "${{ github.repository }}" --json autoMergeRequest --jq '.autoMergeRequest != null')

            # Label first, THEN the marker comment (Codex round 6, same fix as the handoff step
            # above): every staleness checker only trusts a marker at or after the label's own
            # most recent `labeled` event -- posting the marker before the label attach would
            # make it always predate that event, permanently defeating staleness detection for
            # this PR (the opposite of round 4/5's intent). Verify needs-human attached first;
            # this is the last step in the job, so there's no downstream gate to protect by
            # failing it, but exiting non-zero on an unconfirmed human-paging signal is still a
            # useful, visible red mark on the run itself rather than a silent success that hid
            # the problem.
            gh label create needs-human --color d73a4a \
              --description "Needs a human decision -- an automated handler could not safely proceed" \
              --repo "${{ github.repository }}" >/dev/null 2>&1 || true
            gh api --method POST "repos/${{ github.repository }}/issues/${PR}/labels" -f "labels[]=needs-human" >/dev/null 2>&1 || true
            existing_labels=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR}/labels" --jq '.[].name')
            if ! grep -qxF "needs-human" <<< "$existing_labels"; then
              echo "::error::Could not attach needs-human to PR #$PR."
              exit 1
            fi

            # Both comments below carry the same needs-human staleness marker the handoff step
            # uses -- this path attaches needs-human too, and without recording the SHA it
            # covers, a later push that fixes the underlying problem would stay silently
            # stalled by a PR-wide label that never clears itself. `|| true`: best-effort, same
            # reasoning as the handoff step -- the label above is the actual fail-closed signal.
            if [ "$still_armed" = "true" ]; then
              echo "::error::Auto-merge is STILL ARMED for PR #$PR (commit $HEAD_SHA12) despite the disable-auto call."
              gh pr comment "$PR" --repo "${{ github.repository }}" --body "Merge-group CI failed for commit \`$HEAD_SHA12\`, and the attempt-tracking label used to prevent a duplicate/confused handling of this same failure could not be recorded. Attempted to disarm auto-merge, but could NOT confirm it's actually disabled -- this needs urgent human attention: run \`gh pr merge --disable-auto\` yourself and verify, or close/reopen the PR.
              <!-- queue-retry-handler:needs-human sha=$HEAD_SHA12 -->" || true
            else
              gh pr comment "$PR" --repo "${{ github.repository }}" --body "Merge-group CI failed for commit \`$HEAD_SHA12\`, and the attempt-tracking label used to prevent a duplicate/confused handling of this same failure could not be recorded. Disarmed auto-merge rather than risk it -- this needs a human: push a fix, or manually run \`gh pr merge --auto --squash\` once the labeling problem is resolved.
              <!-- queue-retry-handler:needs-human sha=$HEAD_SHA12 -->" || true
            fi
          fi
