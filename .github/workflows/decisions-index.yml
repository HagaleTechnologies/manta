name: Decisions Index

# MAN-440: docs/DECISIONS/README.md's table is generated by scripts/decisions-index.py, and a
# decision-record PR no longer edits it, so two record PRs never conflict on it in the merge
# queue. This workflow is the table's only writer. After a record lands on main it opens one
# "docs(decisions): refresh the decision-record index" PR through CODEX_REVIEW_PAT, so the PR
# takes the trusted path (auto-merge-trigger.yml arms it; wait-for-codex.yml dispatches CI)
# with no change to the trusted-author list. At most one refresh PR is open: an open one that
# does not conflict is left alone (updating it would restart its CI and drop it from the
# queue), and the push its merge makes re-runs this job, which adds whatever landed meanwhile.
# The schedule is a backstop for a failed run or a refresh PR a human closed.
# See docs/DECISIONS/2026-10-27-man440-generated-decisions-index.md.
on:
  push:
    branches: [main]
    paths: ['docs/DECISIONS/**']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: decisions-index
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the decision-record index
    if: github.ref == 'refs/heads/main'
    # Q-0068: CODEX_REVIEW_PAT lives in the main-only codex-review environment.
    environment:
      name: codex-review
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate the index
        id: gen
        run: |
          old_blob=$(git rev-parse HEAD:docs/DECISIONS/README.md)
          python3 scripts/decisions-index.py --write
          changed=$(git status --porcelain)
          if [ -z "$changed" ]; then
            echo "::notice::docs/DECISIONS/README.md already lists every record."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$changed" != " M docs/DECISIONS/README.md" ]; then
            echo "::error::scripts/decisions-index.py --write changed more than docs/DECISIONS/README.md: $changed"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "old_blob=$old_blob" >> "$GITHUB_OUTPUT"
      - name: Open the refresh PR
        if: steps.gen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          OLD_BLOB: ${{ steps.gen.outputs.old_blob }}
          BRANCH: automation/decisions-index
          README: docs/DECISIONS/README.md
          TITLE: "docs(decisions): refresh the decision-record index"
          BODY: "Generated by .github/workflows/decisions-index.yml (MAN-440). It changes only the generated table in docs/DECISIONS/README.md; do not edit it. If it is stuck, close it and run the workflow again."
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open \
            --json number,mergeable --jq '.[0] | select(.) | "\(.number) \(.mergeable)"')
          if [ -n "$pr" ]; then
            read -r number mergeable <<< "$pr"
            if [ "$mergeable" != "CONFLICTING" ]; then
              echo "::notice::Refresh PR #$number is open ($mergeable); the run its merge triggers adds any rows it lacks."
              exit 0
            fi
            gh pr close "$number" --repo "$REPO" --comment "Conflicts with main; replaced by a refresh PR built from main at $BASE_SHA."
          fi
          if ! gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$BASE_SHA" -F force=true >/dev/null 2>&1; then
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA" >/dev/null
          fi
          # The body goes through a file: the README base64-encoded as one argument would hit
          # Linux's 128 KiB per-argument limit once the table passes about 96 KB.
          put_body=$(mktemp)
          python3 - "$README" "$BRANCH" "$OLD_BLOB" "$TITLE" > "$put_body" <<'PY'
          import base64, json, sys
          path, branch, sha, message = sys.argv[1:]
          with open(path, "rb") as f:
              content = base64.b64encode(f.read()).decode("ascii")
          print(json.dumps({"message": message, "content": content, "branch": branch, "sha": sha}))
          PY
          gh api -X PUT "repos/$REPO/contents/$README" --input "$put_body" >/dev/null
          gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$TITLE" \
            --body "$BODY Built from main at $BASE_SHA."
