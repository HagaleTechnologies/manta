name: Supply Chain

# Cargo/crates.io equivalent of widdershins' "Supply Chain" required check (fleet CI redesign
# Phase 2). Governance: see the design proposal this implements,
# catalyst/thoughts/shared/research/2026-09-09-fleet-ci-redesign/manta-supply-chain-check-proposal.md.
#
# WHY THIS RUNS ON EVERY PR/PUSH: the job named "Supply Chain" below is a ruleset-required status
# check on main. A required check that only ran on some events would leave every other PR stuck
# at "Expected -- waiting for status" forever, so this workflow always runs; the scan step is
# gated behind a Cargo.lock/Cargo.toml/deny.toml-changed filter so it only actually does work when
# a dependency or the policy changed. MAN-156: a daily scheduled run on main always scans, so an
# advisory published against an unchanged Cargo.lock still turns something red.
#
# WHAT IT DOES (MAN-156): `cargo deny --locked check` (cargo-deny 0.20.2) checks every resolved
# crate in the checked-out Cargo.lock, all features included, against the policy in deny.toml:
# advisories from the same RustSec database cargo audit used (github.com/RustSec/advisory-db --
# CVEs and known-malicious-crate reports), plus licenses, bans (wildcard requirements, duplicate
# versions) and sources (crates.io and the pinned coppa git repository only). Unlike cargo audit,
# it fails on unmaintained, unsound and yanked crates too, and every failure names the crate and
# the advisory or rule it broke. Like cargo audit, it blocks on ANY finding in the current
# lockfile, not just ones newly introduced by this PR -- cargo-deny has no first-class diff-only
# mode, and a base-vs-head manual diff is meaningfully more custom logic to get right. On
# 2026-10-13 the only finding was RUSTSEC-2024-0449 (unsafe-libyaml, unmaintained, dev-only), now
# ignored with a reason. If a PRE-EXISTING advisory or license blocks an unrelated future PR, add
# an `[advisories] ignore` or `[licenses] allow` entry with a reason to deny.toml (code-owned),
# not a weaker workflow. See docs/DECISIONS/2026-10-13-man156-ci-regression-gates.md.
#
# THREAT MODEL / KNOWN LIMIT: same as widdershins' equivalent -- this defends against malicious
# DEPENDENCY CONTENT, not a PR author rewriting this file itself. `pull_request` (not
# `pull_request_target`) runs the PR's own definition of this workflow, matching every other
# manta workflow's trust model for this exact reason (a same-repo trusted-author PR can already
# edit any workflow, including CI itself). Every action below is pinned to a full commit SHA.
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  # MAN-156: a daily full scan of main, so an advisory published against an unchanged Cargo.lock
  # still turns something red instead of waiting for the next dependency PR.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    outputs:
      # A scheduled run has no diff to filter: it always scans.
      deps: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'schedule'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name != 'schedule'
        id: filter
        with:
          base: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          filters: |
            deps:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/**/Cargo.toml'
              # A deny.toml-only PR (the documented remediation for allowlisting an advisory or
              # a license) must not take the trivial-pass path -- a typo'd or ineffective
              # exemption could land unexercised against the current lockfile, since green PRs
              # auto-merge here (Codex P2, round 2, for the former audit.toml).
              - 'deny.toml'

  audit:
    name: Supply Chain
    needs: changes
    # `if: always()` (Codex P1, round 1): without it, a `changes` job FAILURE (a bad checkout, a
    # paths-filter bug, a transient runner problem) makes this job SKIP rather than run at all --
    # GitHub's default `needs:` gating only proceeds on the needed job's success. This repo's own
    # wait-for-codex.yml documents that a SKIPPED required check satisfies branch protection, so a
    # skip here would let a PR merge with no audit ever having run, silently. Running unconditionally
    # and explicitly failing closed on anything but `changes` succeeding (first step below) turns
    # that into a loud, correctly-attributed failure instead.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail closed if dependency-change detection did not succeed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::'Detect dependency changes' did not succeed (result=${{ needs.changes.result }}) -- failing this required check closed rather than silently skipping the audit."
          exit 1

      - name: Pass trivially (no dependency manifest/lockfile changed)
        if: needs.changes.result == 'success' && needs.changes.outputs.deps != 'true'
        run: echo "No Cargo.lock/Cargo.toml/deny.toml change in this diff -- nothing to scan."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.result == 'success' && needs.changes.outputs.deps == 'true'

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: needs.changes.result == 'success' && needs.changes.outputs.deps == 'true'

      # MAN-156: a prebuilt, checksum-verified cargo-deny (taiki-e/install-action's manifest carries
      # its SHA-256), not a 4-minute source build; this workflow keeps no build cache (MAN-243).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: needs.changes.result == 'success' && needs.changes.outputs.deps == 'true'
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check (advisories, bans, licenses, sources)
        if: needs.changes.result == 'success' && needs.changes.outputs.deps == 'true'
        run: cargo deny --locked check
