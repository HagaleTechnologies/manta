name: Auto-Merge Trigger

# Native merge-queue cutover: retires .mergify.yml (this PR). Mergify's own
# pull_request_rules was doing two jobs at once -- (1) admitting a PR into
# its queue only if it went green AND was authored by a trusted actor, and
# (2) actually performing the merge. GitHub's native `merge_queue` ruleset
# rule (added to main-protection alongside this PR) replaces job (2), but a
# native merge_queue rule has NO author-based admission control of its own
# -- something still has to call `gh pr merge --auto` per PR, and whatever
# does that IS the new job-(1) trust boundary. This job carries that
# boundary forward directly from .mergify.yml's own trusted-author
# condition (`author = thagale` OR `author = catalyst-cloud-connector[bot]`
# OR dependabot-with-a-real-approval) -- manta is public with
# required_approving_review_count now 1 (was 0) but this workflow arms
# every merge it triggers via CODEX_REVIEW_PAT, a bypass actor on
# manta-review-gate ("always" mode). That bypass is evaluated against
# whoever ENABLES auto-merge, not the PR's author -- so without this job's
# own author check, using a shared bypass-capable credential here would let
# ANY green PR skip the review requirement entirely, silently recreating
# the exact zero-review-merge gap this whole redesign exists to close. The
# ruleset's required_approving_review_count is real defense-in-depth (it
# still blocks a manual merge attempt, or a different token, by anyone not
# on this list) but does not replace this check.
#
# Dependabot is deliberately NOT handled here (unlike widdershins, which
# excludes it only via `github.actor != 'dependabot[bot]'`): GitHub
# withholds custom Actions secrets from Dependabot-actor-triggered runs, so
# CODEX_REVIEW_PAT would be empty on exactly the events that would trigger
# this job for a Dependabot PR. Its own auto-merge is armed instead by
# dependabot-auto-merge.yml using GITHUB_TOKEN right after it approves --
# github-actions[bot] isn't a bypass actor on manta-review-gate, so that
# arm only actually merges once required_approving_review_count is
# satisfied by its own approval, no bypass needed.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize, edited]

permissions:
  contents: write
  pull-requests: write
  # Codex round 5: the needs-human staleness check reads the PR's timeline
  # (labeled events) and comments (staleness markers) -- neither endpoint
  # is covered by the pull-requests scope that already suffices for label
  # reads/writes themselves (see queue-retry-handler.yml's own
  # `reference_github_token_pull_requests_write_needed_for_pr_labels`
  # precedent, which is specifically about labels, not comments/timeline).
  issues: read

jobs:
  auto-merge:
    if: |
      github.event.pull_request.draft == false &&
      (
        github.event.pull_request.user.login == 'thagale' ||
        github.event.pull_request.user.login == 'catalyst-cloud-connector[bot]'
      )
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # CODEX_REVIEW_PAT, not GITHUB_TOKEN: a merge attributed to
      # GITHUB_TOKEN suppresses downstream push-triggered events (GitHub's
      # anti-recursion guard), and -- separately, the reason it must be
      # THIS specific credential -- only a bypass actor's own token causes
      # the eventual auto-merge to skip manta-review-gate's required
      # review, which is the whole point for this job's two trusted
      # authors (see header comment).
      #
      # needs-human is checked here, inside the run: block via a fresh API
      # fetch, not in this job's own `if:` (same class of finding Codex
      # raised against dependabot-auto-merge.yml's identical pattern, in
      # queue-retry-handler.yml#186): `github.event.pull_request.labels` is
      # a webhook-delivery-time snapshot, not a live read -- if needs-human
      # gets attached AFTER that snapshot but before this step actually
      # runs, the stale snapshot still reads "no needs-human" and this job
      # would re-arm auto-merge on a PR already handed off to a human. A
      # job-level `if:` has no way to re-evaluate itself against live state
      # right before its steps run; only a fetch inside a step body can.
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Staleness check (Codex round 4, hardened round 5): needs-human is PR-wide with no
          # automatic clearing mechanism (a human decision by design), but queue-retry-handler.yml
          # tags every attach with the exact SHA it was for -- without checking that at all, a
          # fresh commit that fixes the original failure reads the exact same "needs-human
          # present" state the broken one did, and stays silently stalled forever.
          #
          # Round 4's first attempt just asked "does ANY marker name an older sha" -- Codex round
          # 5 found the gap: a maintainer can remove needs-human and later RE-apply it to pause
          # the CURRENT head for an unrelated reason (or the marker-post for that reapplication
          # simply failed, since it's best-effort), and this check would still find the OLD
          # marker from a prior, already-cleared episode and wrongly treat a live pause as stale.
          # Provenance is now checked against the label's own most recent application (via the
          # PR's timeline `labeled` event), not just marker content -- only a marker posted AT OR
          # AFTER that event can be trusted to describe THIS application. Fail closed (keep
          # pausing) whenever provenance can't be confirmed: no labeled event, no marker, or a
          # marker older than the most recent labeling.
          needs_human_is_stale() {
            local current_head_sha12="$1"
            local last_labeled_at marker_info marker_created_at recorded_sha12
            last_labeled_at=$(gh api --paginate "repos/${REPO}/issues/${PR}/timeline" \
              --jq '[.[] | select(.event == "labeled" and .label.name == "needs-human")] | if length > 0 then (last | .created_at) else "" end' 2>/dev/null)
            [ -z "$last_labeled_at" ] && return 1
            marker_info=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
              --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | test("queue-retry-handler:needs-human sha=[0-9a-f]{12}")) | [.created_at, (.body | capture("queue-retry-handler:needs-human sha=(?<s>[0-9a-f]{12})").s)] | @tsv] | if length > 0 then last else "" end' 2>/dev/null)
            [ -z "$marker_info" ] && return 1
            marker_created_at=$(cut -f1 <<< "$marker_info")
            recorded_sha12=$(cut -f2 <<< "$marker_info")
            [ -z "$recorded_sha12" ] && return 1
            [[ "$marker_created_at" < "$last_labeled_at" ]] && return 1
            [ "$recorded_sha12" = "$current_head_sha12" ] && return 1
            return 0
          }

          current_labels=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name')
          if grep -qxF "needs-human" <<< "$current_labels"; then
            current_head_sha12=$(gh pr view "$PR" --repo "${REPO}" --json headRefOid --jq '.headRefOid[0:12]')
            if needs_human_is_stale "$current_head_sha12"; then
              # Clear the label, not just ignore it (Codex round 5): leaving it attached would
              # let queue-retry-handler.yml's own retry step see this same stale needs-human on
              # this new revision's eventual merge-group failure and refuse to retry it --
              # silently stalling a corrected revision after its very first queue attempt.
              echo "::notice::needs-human on PR #$PR is stale (provably tied to an earlier revision, not the current head $current_head_sha12) -- clearing it and proceeding to arm auto-merge for the new revision."
              gh api --method DELETE "repos/${REPO}/issues/${PR}/labels/needs-human" >/dev/null 2>&1 || true
              gh pr merge "$PR_URL" --auto --squash
            else
              echo "::notice::PR #$PR has needs-human covering its current head (or its provenance could not be confirmed) -- standing down without re-arming auto-merge."
            fi
          else
            gh pr merge "$PR_URL" --auto --squash
          fi
