name: Release

# MAN-21: builds and validates the release binaries + Docker image for every committed
# platform, from `workflow_dispatch` (manual re-run) or a real `v*` tag push.
#
# HAG-47: `pull_request` DROPPED as a trigger (2026-09-09 fleet CI redesign report, week-1
# stop-the-bleed list -- flagged then, never actually done until now). This was wasted
# PR-time build cost with no corresponding requirement: none of this file's jobs (`build`,
# `docker-build`) are required status checks (confirmed via `gh api
# repos/HagaleTechnologies/manta/rulesets` -- required checks are `test (macos-latest)`,
# `test (ubuntu-latest)`, `Wait for Codex Review`, `Supply Chain`), and no other workflow in
# this repo depends on a PR-triggered run of this one. Release artifacts are only ever
# consumed from a tag push; a PR touching release.yml/release-publish.yml/Dockerfile/etc. now
# gets no build here at all until it's tagged.
#
# This file NEVER publishes anything and NEVER requests write permissions anywhere --
# deliberately, a leftover invariant from when this file also ran on `pull_request` without a
# PR being able to reach any credential by editing it (PR #78 review round 6); left in place
# since it's still true and still cheap insurance. The actual publish path (Docker push to
# GHCR, GitHub Release creation) lives in release-publish.yml, which never had a
# `pull_request` trigger at all -- see that file's own header comment.

on:
  push:
    tags:
      # MAN-65: 'v*' also matched non-release tags (e.g. `vendor-freeze`),
      # each of which used to spend five platform builds just to fail. The
      # glob language can't express SemVer, so it only filters the obvious
      # non-releases; validate-tag below gives the explicit, readable
      # failure for near-misses (v1.2.3+linux and friends) -- a near-miss
      # must FAIL loudly, not be silently ignored.
      - 'v[0-9]*'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: manta

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # MAN-65: same gate as release-publish.yml's, and `build` needs it, so a
  # near-miss tag fails here in seconds instead of also starting all five
  # platform builds (PR #107 review). The push-only condition sits on the
  # STEP, not the job: a job skipped by its own `if:` also skips everything
  # that needs it, which would silently skip the entire build matrix on
  # every `workflow_dispatch` run. On a dispatch the tag checks are no-ops
  # (the man pages below are still rendered): a dispatch is a manual build
  # of whatever ref was picked (branch or tag), not a tag push, and this
  # file never publishes it.
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: github.event_name == 'push'
        shell: bash
        run: scripts/release-version.sh validate "$GITHUB_REF_NAME"

      - name: Require release commit on the default branch
        if: github.event_name == 'push'
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/check-release-ancestry.sh "$RELEASE_COMMIT" "$DEFAULT_BRANCH"

      # MAN-133: the man pages every `build` archive ships, rendered once from a
      # native build (MAN-82: `build-soapy` renders its own, for its features).
      # Their text depends only on Cargo features -- the same as every
      # build leg's, pinned by scripts/tests/test_package_release.py -- never on
      # the target, and the aarch64 leg's cross-built binary cannot run on its
      # runner. Here, after the tag checks, so a bad tag still fails before any
      # build, and `build` keeps needing only this job (release-version.test.sh
      # and release-ancestry.test.sh in scripts/tests/). A failure from here on
      # says nothing about the tag. The artifact is named so the release job's
      # `manta-*` download never publishes it.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # MAN-243: no build cache here either; this binary is never shipped.
      - name: Build (host)
        run: cargo build --release -p manta-cli --features hpsdr
      - name: Write man pages
        run: target/release/manta man-pages --out man-pages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: man-pages
          path: man-pages
          if-no-files-found: error
          retention-days: 14

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS x86_64: macos-13 was retired (no longer in GitHub's
          # supported runner-image table as of this workflow) -- the
          # current Intel label is macos-15-intel (PR #78 review round 1).
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: manta-macos-x86_64
          # macOS arm64: macos-14+ runners are Apple Silicon natively.
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: manta-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: manta-windows-x86_64
            exe_ext: .exe
            # MAN-65 finding 2: x86_64-pc-windows-msvc links the MSVC C
            # runtime DYNAMICALLY by default, so manta.exe cannot start on
            # a clean Windows install that has never had the Visual C++
            # 2015-2022 Redistributable -- and this ZIP ships only
            # manta.exe, README.md and the licences, nothing that would fix
            # that. Static CRT rather than bundling Microsoft's
            # redistributable installer: bundling adds a redistribution
            # question and an install step to the one path whose entire
            # point is unpack-and-run. Safe for this dependency graph:
            # `cargo build -p manta-cli` compiles no C code on Windows (the
            # only cc-using crate in Cargo.lock, `alloca`, is reachable
            # only through criterion, a dev-dependency), and Windows
            # platform access goes through windows-sys import libraries
            # against system DLLs.
            #
            # Set as a per-matrix-entry RUSTFLAGS rather than
            # .cargo/config.toml (kept identical to release-publish.yml's
            # copy of this comment on purpose -- both files build this
            # target and must not drift): a repo-wide cargo config file
            # changes every contributor's local Windows build by default,
            # a bigger blast radius than this fix needs, and this way the
            # flag is visibly scoped to exactly the one target it's for.
            # The trade-off, accepted: a contributor building locally on
            # Windows does not get the static CRT automatically and would
            # need to set this RUSTFLAGS themselves. The "Assert the
            # Windows binary is statically CRT-linked" step below is what
            # keeps this true in CI regardless.
            rustflags: '-C target-feature=+crt-static'
          # Linux x86_64: built via `cross` rather than natively on
          # ubuntu-latest (PR #78 review round 1) -- a native build on
          # the current runner's glibc would raise the binary's minimum
          # glibc symbol-version requirement above what's actually
          # available on still-supported distros (RHEL 8, Debian 11,
          # Ubuntu 20.04), despite README advertising a generic Linux
          # x86_64 binary. cross-rs's images are deliberately built on an
          # older base for exactly this reason.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: manta-linux-x86_64
            use_cross: true
          # Linux arm64: covers Raspberry Pi OS 64-bit and other ARM
          # SBCs. Cross-compiled via `cross` (cross-rs) rather than a
          # native runner -- GitHub has no arm64 Linux hosted runner in
          # this repo's plan, and `cross` handles the ALSA
          # (cpal's Linux backend, an unconditional dependency of
          # manta-input) cross-linking via Cross.toml's pre-build hook.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: manta-linux-arm64
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # MAN-243: no build cache, on purpose. A restored entry carries target/ objects and
      # ~/.cargo/bin + .crates.toml (rust-cache's paths) from whichever run wrote it -- including a
      # `cross` that `cargo install cross --version 0.2.5 --locked` below would then treat as already
      # installed. Release artifacts are built from the tagged tree and a fresh toolchain only; the
      # extra build time is accepted. See docs/DECISIONS/2026-10-10-man243-ci-trust-boundary.md.

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (native)
        if: "!matrix.use_cross"
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release -p manta-cli --features hpsdr --target ${{ matrix.target }}

      # `soapy` is deliberately excluded from every release binary in this
      # matrix -- it links against the SoapySDR system library, which
      # doesn't have a straightforward statically-linked or vendored
      # cross-compilation story across 5 targets. MAN-82: the separate
      # `build-soapy` job below ships one extra Linux x86_64 archive with
      # it, for Ubuntu 24.04; elsewhere operators build from source with
      # --features soapy (documented in README). `hpsdr` has no
      # native-library dependency at all (pure
      # UDP/std, see crates/manta-input/src/hpsdr.rs's own module docs)
      # so it's safe and directly relevant (MAN-21's own motivating
      # George/K5TR conversation is an HPSDR use case) to always enable.
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release -p manta-cli --features hpsdr --target ${{ matrix.target }}

      # MAN-65 finding 2 (PR #78 review): on a clean Windows install without
      # the VC++ 2015-2022 Redistributable, a dynamically-CRT-linked
      # manta.exe cannot start -- and this ZIP contains only the exe, the
      # README and the licences, contradicting README's unpack-and-run
      # install path. The matrix's `rustflags` entry above links the CRT
      # statically for this target; this step is what keeps that true,
      # since nothing else in CI would notice if the flag were dropped or
      # overridden by a RUSTFLAGS environment variable.
      #
      # Substring scan of the raw bytes rather than `dumpbin /dependents`:
      # dumpbin needs the VS developer environment imported (an extra
      # third-party action to pin and audit), while PE import-table DLL
      # names are stored as plain ASCII, so their ABSENCE is conclusive.
      # The KERNEL32 assertion below is what makes that argument valid --
      # it proves the scan can see import names at all, so "no
      # VCRUNTIME140" means "not imported" rather than "scan looked at the
      # wrong thing".
      - name: Assert the Windows binary is statically CRT-linked
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/${env:BIN_NAME}${{ matrix.exe_ext }}"
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if ($ascii -notmatch 'KERNEL32\.dll') {
            Write-Error "import-name scan found no KERNEL32.dll -- the scan itself is broken, not the binary"
            exit 1
          }
          foreach ($dll in @('VCRUNTIME140', 'MSVCP140', 'api-ms-win-crt-')) {
            if ($ascii -match [regex]::Escape($dll)) {
              Write-Error "$exe imports $dll -- the dynamic MSVC runtime is back (MAN-65 finding 2). Check the release matrix's Windows rustflags entry and any RUSTFLAGS override."
              exit 1
            }
          }
          Write-Host "OK: no dynamic MSVC CRT imports."

      # MAN-133: the pages validate-tag rendered; Package ships them in man/man1.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: man-pages
          path: man-pages

      # MAN-268: one helper and one asset list for tar.gz and zip alike -- the binary, README,
      # licences, example config and service kit (scripts/tests/test_package_release.py runs this
      # step's body). Git Bash on Windows, where the interpreter is `python`, not `python3`.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          format=tar.gz
          py=python3
          if [ "${{ runner.os }}" = "Windows" ]; then
            format=zip
            py=python
          fi
          "$py" scripts/package-release.py \
            --binary "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.exe_ext }}" \
            --artifact "${{ matrix.artifact }}" \
            --format "$format" \
            --man-dir man-pages \
            --out-dir .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore
          retention-days: 14

  # MAN-82: one extra Linux x86_64 archive with the `soapy` input, for RTL-SDR, Airspy,
  # SDRplay and HackRF operators who should not need Rust to use them. The five `build` legs
  # above keep `hpsdr` only, so their users never need libSoapySDR. This binary links
  # libSoapySDR.so.0.8 dynamically, so it is built natively on the Ubuntu release it supports
  # (pinned, not ubuntu-latest) and run there by operators who install the library and their
  # device's module (README, "SoapySDR on Linux x86_64"). It renders its own man pages: the
  # validate-tag pages describe the hpsdr-only binary and would omit the Soapy flags.
  # release-publish.yml's `release` needs this job, so a failed or skipped build publishes
  # nothing. See docs/DECISIONS/2026-10-14-man82-soapy-release-archive.md.
  build-soapy:
    needs: validate-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Link-time dependencies only. Device modules are runtime choices for operators and are
      # not needed to build.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libsoapysdr-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      # MAN-243: no build cache here either, for the same reasons as `build`.
      - name: Build (soapy)
        run: cargo build --release --locked -p manta-cli --features hpsdr,soapy --target x86_64-unknown-linux-gnu

      # The real library's null-device open, activate and read-error paths, with the release
      # features combined.
      - name: Test the Soapy input against the real library
        run: cargo test --release --locked -p manta-input --features hpsdr,soapy --lib soapy::tests

      - name: Write man pages
        run: target/x86_64-unknown-linux-gnu/release/manta man-pages --out man-pages-soapy

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-release.py \
            --binary "target/x86_64-unknown-linux-gnu/release/${BIN_NAME}" \
            --artifact manta-linux-x86_64-soapy \
            --format tar.gz \
            --man-dir man-pages-soapy \
            --out-dir .

      # Runs the extracted archive, never target/ (scripts/tests/test_soapy_release.py).
      - name: Verify the archive on the build runner
        run: python3 scripts/check-soapy-release.py manta-linux-x86_64-soapy.tar.gz

      # The operator's machine: a fresh Ubuntu 24.04 with no Rust, compiler or -dev package, and
      # nothing from this runner but the archive and the verifier, both read-only. First the
      # binary must fail to start for want of libSoapySDR alone, then pass every check once the
      # runtime library and three distro device modules are installed.
      - name: Verify the archive in a clean Ubuntu 24.04 runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/manta-linux-x86_64-soapy.tar.gz:/release/manta-linux-x86_64-soapy.tar.gz:ro" \
            -v "$PWD/scripts/check-soapy-release.py:/release/check-soapy-release.py:ro" \
            ubuntu:24.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends python3 libasound2t64
              python3 /release/check-soapy-release.py --expect-missing-soapy-library /release/manta-linux-x86_64-soapy.tar.gz
              apt-get install -y --no-install-recommends libsoapysdr0.8 soapysdr0.8-module-rtlsdr soapysdr0.8-module-airspy soapysdr0.8-module-hackrf
              if command -v cargo || command -v rustc || command -v cc; then
                echo "the runtime container has a Rust toolchain or C compiler" >&2
                exit 1
              fi
              if dpkg-query -W -f "\${Package}\n" | grep -E -- "-dev(:|$)"; then
                echo "the runtime container has development packages" >&2
                exit 1
              fi
              python3 /release/check-soapy-release.py /release/manta-linux-x86_64-soapy.tar.gz
            '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manta-linux-x86_64-soapy
          path: manta-linux-x86_64-soapy.tar.gz
          if-no-files-found: error
          retention-days: 14

  docker-build:
    # Build-and-validate only, never pushes, never requests packages:write
    # -- see the top-of-file comment for why that's what makes it safe to
    # also run on `pull_request`.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
