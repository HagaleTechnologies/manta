name: Release

# MAN-21: a tagged release (v*) publishes a GitHub Release with a prebuilt
# `manta` binary for every committed platform, built from that exact
# tagged commit, plus a multi-arch Docker image pushed to GHCR.
#
# A GitHub Release is ONLY ever created from a real `v*` tag push --
# never from `pull_request` or `workflow_dispatch` (softprops/action-
# gh-release requires an explicit tag for non-tag events, and there's no
# sane tag to invent for either of those triggers; PR #78 review round 1).
#
# Two ways to exercise the build+Docker matrix without creating a release:
# - `pull_request` (path-filtered to the files below) runs it automatically
#   on any PR touching the release pipeline itself -- this is what actually
#   solves the "how do you validate a BRAND NEW workflow_dispatch-triggered
#   workflow before it's even on the default branch" bootstrap problem
#   (GitHub only delivers workflow_dispatch for a workflow file that
#   already exists on the default branch -- PR #78 review round 1).
# - `workflow_dispatch` (`publish=true`) additionally pushes real Docker
#   tags to GHCR, for testing that path specifically post-merge; it never
#   creates a GitHub Release.
#
# Known limitations, deferred as MAN-65 (later review round -- ticketed
# per the PR review convergence policy rather than another live round):
# a `v*` tag with SemVer build metadata (e.g. v1.2.3+linux) would produce
# an invalid Docker tag; the Windows archive needs the VC++ Redistributable
# installed separately (dynamic MSVC runtime, not bundled); overlapping
# tag pushes could theoretically race on the shared `:latest` tag; and a
# brand-new GHCR package defaults to private on first publish -- the
# README's anonymous `docker run` command won't work until a maintainer
# manually flips it to public in GitHub's package settings the first time
# a real tag actually publishes (deliberately not automated here --
# changing a package's visibility is a "make something public" action
# outside what this workflow should do unsupervised).

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Dockerfile'
      - 'Cross.toml'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also push the Docker image to GHCR (never creates a GitHub Release -- that only ever happens from a real v* tag push)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: manta

# One in-flight run per ref for a real tag push (never cancel a release
# build mid-flight); each pull_request and workflow_dispatch run gets its
# own group keyed on run_id, so unrelated PRs/manual runs never contend
# with each other or with a tag's own release build (PR #78 review round
# 1 -- an earlier draft used github.ref unconditionally, which put every
# manual dispatch from the same branch in the SAME group, letting a third
# dispatch silently cancel a second one's still-pending run).
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS x86_64: macos-13 was retired (no longer in GitHub's
          # supported runner-image table as of this workflow) -- the
          # current Intel label is macos-15-intel (PR #78 review round 1).
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: manta-macos-x86_64
          # macOS arm64: macos-14+ runners are Apple Silicon natively.
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: manta-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: manta-windows-x86_64
            exe_ext: .exe
          # Linux x86_64: built via `cross` rather than natively on
          # ubuntu-latest (PR #78 review round 1) -- a native build on
          # the current runner's glibc would raise the binary's minimum
          # glibc symbol-version requirement above what's actually
          # available on still-supported distros (RHEL 8, Debian 11,
          # Ubuntu 20.04), despite README advertising a generic Linux
          # x86_64 binary. cross-rs's images are deliberately built on an
          # older base for exactly this reason.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: manta-linux-x86_64
            use_cross: true
          # Linux arm64: covers Raspberry Pi OS 64-bit and other ARM
          # SBCs. Cross-compiled via `cross` (cross-rs) rather than a
          # native runner -- GitHub has no arm64 Linux hosted runner in
          # this repo's plan, and `cross` handles the ALSA
          # (cpal's Linux backend, an unconditional dependency of
          # manta-input) cross-linking via Cross.toml's pre-build hook.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: manta-linux-arm64
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release -p manta-cli --features hpsdr --target ${{ matrix.target }}

      # `soapy` is deliberately excluded from every release binary in this
      # matrix -- it links against the SoapySDR system library, which
      # doesn't have a straightforward statically-linked or vendored
      # cross-compilation story across 5 targets. Operators who need it
      # build from source with --features soapy (unchanged, documented in
      # README). `hpsdr` has no native-library dependency at all (pure
      # UDP/std, see crates/manta-input/src/hpsdr.rs's own module docs)
      # so it's safe and directly relevant (MAN-21's own motivating
      # George/K5TR conversation is an HPSDR use case) to always enable.
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release -p manta-cli --features hpsdr --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dist="dist/${{ matrix.artifact }}"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.exe_ext }}" "$dist/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dist/" 2>/dev/null || cp README.md "$dist/"
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:BIN_NAME}${{ matrix.exe_ext }}" $dist
          Copy-Item README.md $dist
          if (Test-Path LICENSE-MIT) { Copy-Item LICENSE-MIT $dist }
          if (Test-Path LICENSE-APACHE) { Copy-Item LICENSE-APACHE $dist }
          Compress-Archive -Path $dist -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore
          retention-days: 14

  docker:
    # Gated on the native/cross build matrix (PR #78 review round 1) --
    # without this, a real tag push could publish Docker tags for a
    # release where a Windows/macOS/Linux leg had already failed, since
    # this job previously had no dependency on `build` at all.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Determine version, image, push flag, and tag list
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dispatch-${{ github.run_id }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # OCI/Docker repository paths must be lowercase; github.repository
          # is case-preserving ("HagaleTechnologies/manta") and buildx
          # rejects a mixed-case tag outright (PR #78 review round 1).
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          # Computed as an explicit true/false string here rather than
          # inline in the `push:` input below (PR #78 review round 7):
          # GitHub Actions' `||` returns whichever operand it evaluates,
          # not a coerced boolean -- on a pull_request event, `inputs`
          # doesn't exist at all, so `github.event_name == 'push' ||
          # inputs.publish` evaluated to an empty string, which
          # docker/build-push-action's strict YAML 1.2 Core Schema
          # boolean-input validation rejects outright ("Input does not
          # meet YAML 1.2 'Core Schema' specification: push"), failing
          # every pull_request-triggered run of this job.
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.publish }}" == "true" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

          # `:latest` is reserved for real tag pushes only (PR #78 review
          # round 2) -- a workflow_dispatch run with publish=true can
          # target any branch, not just a release, and README's `docker
          # run ghcr.io/.../manta:latest` install command must always
          # trace to a real tagged release, not a manual test build that
          # happened to also push. The dispatch-<run_id> tag is still
          # pushed on a dispatch publish, for testing that path
          # specifically -- just never `:latest`.
          {
            echo "tags<<RELEASE_TAGS_EOF"
            echo "$IMAGE:$VERSION"
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              echo "$IMAGE:latest"
            fi
            echo "RELEASE_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.version.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.version.outputs.push == 'true' }}
          tags: ${{ steps.version.outputs.tags }}

  release:
    needs: [build, docker]
    # Only ever from a real tag push -- see the top-of-file comment for
    # why workflow_dispatch/pull_request never reach this job.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: find dist -type f

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
