name: Windows bundle smoke

# Native fixture coverage also runs for trusted authors whose full CI is dispatched
# from main. This read-only PR job has no credentials for publishing checks.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  smoke:
    name: Windows bundle smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: scripts/check-rust-toolchain-pin.sh
        shell: bash
      - run: python -m unittest -v scripts.tests.test_ci_shards_windows
