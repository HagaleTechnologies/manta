name: Wait for Codex

# HAG-46: event-driven Codex gate, ported from credenza's proven
# codex-review-request.yml/codex-review-response.yml pair (live on cqdx, widdershins HAG-44,
# vanity HAG-45) -- but INLINED here, not called via `uses:`, because manta is PUBLIC and
# credenza is PRIVATE. GitHub does not allow a public repository to call a workflow_call
# reusable workflow stored in a private repository -- confirmed live on manta PR #199 (the
# Dependabot-auto-merge revert this exact constraint broke). This file was already
# self-contained before this migration for the identical reason (see the old poll-loop
# version's own header); the event-driven mechanism inherits that same constraint, so it stays
# self-contained too. Logic below is a direct, line-by-line port of credenza's two reusable
# workflows at 03dd34fb2bbd1fea9e3e67fa7429bb17b118eb77 (the SHA cqdx/widdershins/vanity pin),
# adapted only where the workflow_call wrapper's `inputs:`/bootstrap-detection machinery is
# meaningless for a monolithic file with nothing to "detect migration" for -- see each job's
# own comments for exactly what changed and why.
#
# Replaces the OLD ~1100-line inline poll loop (every 20s, up to 70min per push) with two
# seconds-long, event-triggered jobs: codex-review-request posts "@codex review" and creates a
# pending check-run, then exits; codex-review-response reacts to Codex's own
# pull_request_review/issue_comment event, evaluates once, and dispatches ci-full.yml (this
# repo's workflow_dispatch-only heavy tier, split out of the old ci.yml -- see that file's own
# header) only once the revision is confirmed clean. credenza's own
# codex-review-timeout-scan.yml (org-wide, 15min cron, `search/issues?q=org:HagaleTechnologies+
# is:pr+is:open`) already covers manta automatically -- that scan runs FROM credenza against
# the GitHub API, not a workflow_call INTO credenza, so the public/private constraint does not
# apply to it at all. No per-repo backstop wiring needed here.
#
# pull_request_target for the request half -- same reasoning as the pre-migration version of
# this file (a same-repo PR editing this file could otherwise run its own modified copy with
# CODEX_REVIEW_PAT still in scope -- pull_request_target always reads its workflow definition
# from the BASE branch, closing that hole). pull_request_review/issue_comment for the response
# half don't carry that same specific risk (no ref checkout tied to the event), but keep
# write-scoped secrets out of a plain pull_request context regardless.
on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  # Fleet CI redesign, native merge-queue cutover: "Wait for Codex Review" is a required check,
  # so a merge_group entry needs it to report on its own synthetic SHA or the entry sits
  # pending until check_response_timeout_minutes and gets dequeued. No re-review is meaningful
  # here (the constituent PR already passed a real Codex round during its own PR phase; there's
  # no PR to comment on or resolve threads against for a synthetic integration commit) --
  # unchanged from the pre-migration version of this file.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  # actions: write -- codex-review-request/codex-review-response each dispatch ci-full.yml via
  # the Actions API on a pass-through or a clean verdict.
  actions: write

jobs:
  # Producer half (credenza codex-review-request.yml, inlined). Creates a check-run and asks
  # Codex to look; never waits for a response itself -- either an immediate pass-through
  # (dispatches ci-full.yml directly, no Codex round applies), or leaves the check-run
  # in_progress for codex-review-response to complete once Codex actually replies.
  #
  # Bootstrap-check step DROPPED (the one real difference from credenza's reusable version):
  # that step exists solely to let a CALLING repo's producer file distinguish "genuinely
  # migrated" from "pre-migration file that happens to exist at this base SHA" -- meaningless
  # here, since this IS the producer file, inline, with no caller/callee split to bootstrap.
  # The moment this PR merges, every subsequent PR's pull_request_target run executes this
  # exact logic directly; there is no intermediate "not ready yet" state to detect.
  codex-review-request:
    name: Codex review clean (gate before expensive downstream jobs)
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: codex-review-request-${{ github.event.pull_request.number }}
      cancel-in-progress: ${{ github.run_attempt == 1 }}
    outputs:
      check_run_id: ${{ steps.create-check.outputs.check_run_id }}
    steps:
      - name: Self-heal — does the codex-clean label already exist for this exact head?
        id: existing-label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target="codex-clean:${HEAD_SHA:0:12}"
          if labels=$(gh api "repos/$REPO/issues/$PR/labels?per_page=100" --jq '[.[].name]' 2>/dev/null); then
            if echo "$labels" | jq -e --arg l "$target" 'index($l) != null' >/dev/null 2>&1; then
              echo "already_clean=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "already_clean=false" >> "$GITHUB_OUTPUT"

      - name: Create the codex-clean check-run
        id: create-check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALREADY_CLEAN: ${{ steps.existing-label.outputs.already_clean }}
          # exclude_dependabot: true hardcoded (matches this file's own pre-migration
          # `github.actor != 'dependabot[bot]'` job-level exclusion).
          IS_EXCLUDED_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -o pipefail
          # Bootstrap not applicable here (see this job's own header comment) -- pass-through
          # branches are: the label already exists, an excluded dependabot[bot] PR, or a draft
          # PR (never asked to wait on Codex at all). Every pass-through branch is also a
          # dispatch trigger below: under the OLD design, "success now" meant the expensive
          # jobs, living in ci.yml's own pull_request-triggered run, just ran as part of the
          # same event -- under this split design that no longer happens on its own, so this
          # job must explicitly dispatch ci-full.yml itself whenever it passes a revision
          # through without a real Codex round to wait on.
          #
          # opened/ready_for_review are NOT a pass-through branch: org-wide policy disables
          # Codex's native auto-triggering entirely (only an explicit "@codex review"/"@codex
          # security review" comment triggers a review now) -- silently trusting a native
          # trigger that no longer fires would report every fresh PR as "clean" without Codex
          # ever having looked. There is exactly one path to a real review: this workflow's own
          # explicit request below, for every non-draft/non-dependabot/not-already-labeled
          # revision, regardless of which action triggered it.
          if [ "$IS_DRAFT" = "true" ]; then
            conclusion="success"
          elif [ "$IS_EXCLUDED_DEPENDABOT" = "true" ]; then
            conclusion="success"
          elif [ "$ALREADY_CLEAN" = "true" ]; then
            conclusion="success"
          else
            conclusion=""
          fi

          # Also create "Wait for Codex Review" alongside "Codex review clean..." -- main-
          # protection's required_status_checks hardcodes that literal check name (a holdover
          # from the pre-event-driven design's own aggregator job of the same name). This job
          # never produces that name otherwise, which would leave EVERY PR permanently unable
          # to merge once this migration lands, not just this one.
          if [ -n "$conclusion" ]; then
            check_id=$(gh api -X POST "repos/$REPO/check-runs" \
              -f name="Codex review clean (gate before expensive downstream jobs)" \
              -f head_sha="$HEAD_SHA" \
              -f status="completed" \
              -f conclusion="$conclusion" \
              --jq '.id')
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="Wait for Codex Review" \
              -f head_sha="$HEAD_SHA" \
              -f status="completed" \
              -f conclusion="$conclusion" >/dev/null
            echo "Created completed check-run ($conclusion) for $HEAD_SHA -- no wait needed."
          else
            check_id=$(gh api -X POST "repos/$REPO/check-runs" \
              -f name="Codex review clean (gate before expensive downstream jobs)" \
              -f head_sha="$HEAD_SHA" \
              -f status="in_progress" \
              --jq '.id')
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="Wait for Codex Review" \
              -f head_sha="$HEAD_SHA" \
              -f status="in_progress" >/dev/null
            echo "Created in_progress check-run for $HEAD_SHA -- codex-review-response will complete it once Codex responds."
          fi
          {
            echo "check_run_id=$check_id"
            echo "conclusion=$conclusion"
            echo "is_dependabot=$IS_EXCLUDED_DEPENDABOT"
          } >> "$GITHUB_OUTPUT"

      - name: Request a review
        if: steps.create-check.outputs.check_run_id != '' && steps.create-check.outputs.conclusion != 'success'
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CODEX_REVIEW_PAT not available (fork PR, or secret unset) -- skipping the request comment. A formal Codex review tied to this head still resolves the check normally via codex-review-response."
            exit 0
          fi
          gh api "repos/$REPO/issues/$PR/comments" -f body="@codex review" >/dev/null

      - name: Dispatch full CI (pass-through success -- no Codex round to wait on)
        # Excludes the Dependabot case (Codex review, PR #200 round 1, P1): GitHub withholds
        # ALL custom Actions secrets from a Dependabot-actor-triggered run, so CODEX_REVIEW_PAT
        # is empty here on exactly the revisions that would need it, and GITHUB_TOKEN is
        # rejected outright for the workflow_dispatch endpoint regardless -- there is no
        # credential available to make this call for a Dependabot PR. ci-full.yml's own
        # `pull_request` trigger (scoped to `github.actor == 'dependabot[bot]'`, see that
        # file's header) runs test/test-soapy/test-hpsdr natively for this case instead, with
        # no dispatch or PAT needed at all -- the check-run this job already created above
        # (conclusion=success) is a compatibility artifact only; the REAL required checks
        # ("test (ubuntu-latest)"/"test (macos-latest)") come from that native run.
        if: steps.create-check.outputs.check_run_id != '' && steps.create-check.outputs.conclusion == 'success' && steps.create-check.outputs.is_dependabot != 'true'
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_DEPENDABOT: ${{ steps.create-check.outputs.is_dependabot }}
        run: |
          # Dispatch at the repo's default branch, never the PR's own head branch -- a
          # same-repo PR could otherwise replace ci-full.yml with an immediate-success job (or
          # run arbitrary steps with this caller's secrets). GH_TOKEN must be a PAT, not
          # github.token: GitHub rejects a workflow_dispatch POST authenticated with the
          # built-in GITHUB_TOKEN outright ("Resource not accessible by integration", 403),
          # regardless of this job's own declared `actions: write` permission.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CODEX_REVIEW_PAT not set -- cannot dispatch ci-full.yml (github.token is rejected outright for workflow_dispatch by GitHub itself). The check-run above is already marked success, but CI will never run for $HEAD_SHA without a manual dispatch."
            exit 1
          fi
          default_branch=$(gh api "repos/$REPO" --jq '.default_branch')
          gh api -X POST "repos/$REPO/actions/workflows/ci-full.yml/dispatches" \
            -f ref="$default_branch" -f "inputs[head_sha]=$HEAD_SHA" -f "inputs[is_dependabot]=$IS_DEPENDABOT"

  # Consumer half (credenza codex-review-response.yml, inlined). Runs the verdict-evaluation
  # logic ONCE, on the actual event, instead of the old design's 20s poll loop. No
  # cross-invocation state: everything is re-derived from live GitHub data using timestamp
  # comparison against the request comment's own creation time.
  codex-review-response:
    name: Codex review response
    if: |
      (github.event_name == 'pull_request_review' && (github.event.review.user.login == 'chatgpt-codex-connector' || github.event.review.user.login == 'chatgpt-codex-connector[bot]')) ||
      (github.event_name == 'issue_comment' && (github.event.comment.user.login == 'chatgpt-codex-connector' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: codex-review-response-${{ github.run_attempt == 1 && (github.event.pull_request.number || github.event.issue.number || github.run_id) || github.run_id }}
      # false, not true: GitHub queues/cancels a job's concurrency slot for the RUN as
      # scheduled, independent of the job's own `if:` -- an unrelated human or bot comment on
      # the SAME PR shares this group and would cancel an in-flight, actually qualifying
      # chatgpt-codex-connector response before its "update the check-run" step ever runs,
      # permanently stranding that revision's pending check until Codex happens to respond
      # again. Real qualifying responses for one PR are rare enough that letting them queue
      # sequentially instead of cancelling costs nothing.
      cancel-in-progress: false
    steps:
      - name: Resolve PR context
        id: pr-context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            PR="${{ github.event.pull_request.number }}"
          else
            PR="${{ github.event.issue.number }}"
          fi
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Skip if this review targeted a superseded head
        id: head-check
        if: github.event_name == 'pull_request_review'
        run: |
          if [ "${{ github.event.review.commit_id }}" != "${{ steps.pr-context.outputs.head_sha }}" ]; then
            echo "::notice::This review targeted ${{ github.event.review.commit_id }}, which is no longer the PR's current head (${{ steps.pr-context.outputs.head_sha }}) -- skipping as superseded."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the most recent request comment for this head
        id: request-comment
        if: steps.head-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
        run: |
          # --paginate --slurp, not bare --paginate (Codex P2, manta PR #200 review round 2): a
          # single 100-item page can miss the actual latest "@codex review" request on a PR with
          # more comments than that, selecting a stale older one instead -- its stale timestamp
          # then misclassifies findings raised between the two requests as "new in the current
          # clean round", failing the check for no real reason. `gh api --paginate` alone streams
          # each page as its OWN separate top-level JSON array ("Each page is a separate JSON
          # array or object" -- gh api --help); combined with --jq, the filter runs once PER
          # PAGE, not once over the combined set, so `sort_by(.created_at) | last` would only
          # ever compare requests within a single page. --slurp wraps every page into one outer
          # array first -- but gh CLI rejects --slurp combined with --jq outright ("the --slurp
          # option is not supported with --jq or --template"), so fetch (slurp) and filter (real
          # jq) are two explicit, piped steps here instead of one combined --jq call.
          comment=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments?per_page=100" \
            | jq '[.[][] | select(.body == "@codex review")] | sort_by(.created_at) | last')
          if [ "$comment" = "null" ] || [ -z "$comment" ]; then
            echo "::warning::No '@codex review' request comment found on PR #$PR -- this event may predate the event-driven migration, or the request step failed. Falling back to 30 minutes ago as RUN_STARTED."
            echo "run_started=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            echo "comment_node_id=" >> "$GITHUB_OUTPUT"
          else
            echo "run_started=$(echo "$comment" | jq -r '.created_at')" >> "$GITHUB_OUTPUT"
            echo "comment_node_id=$(echo "$comment" | jq -r '.node_id')" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute baseline threads as of the request comment
        id: baseline
        if: steps.head-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          SINCE: ${{ steps.request-comment.outputs.run_started }}
        run: |
          owner="${REPO%%/*}"; name="${REPO##*/}"
          response=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 50) { nodes { author { login } createdAt } }
                    }
                  }
                }
              }
            }' -f owner="$owner" -f name="$name" -F pr="$PR")
          echo "$response" | jq --arg since "$SINCE" '
            [.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select(.comments.nodes[0].createdAt < $since)
              | select([.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions"))
              | .id]' > /tmp/baseline-pure.json
          echo "$response" | jq --arg since "$SINCE" '
            [.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select(.comments.nodes[0].author.login == "chatgpt-codex-connector")
              | select(.comments.nodes[0].createdAt < $since)
              | .id]' > /tmp/baseline-initiated.json
          {
            echo "baseline_pure<<BASELINE_EOF"
            cat /tmp/baseline-pure.json
            echo "BASELINE_EOF"
            echo "baseline_initiated<<BASELINE_EOF2"
            cat /tmp/baseline-initiated.json
            echo "BASELINE_EOF2"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate whether Codex responded on this revision
        id: verdict
        if: steps.head-check.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          SINCE: ${{ steps.request-comment.outputs.run_started }}
          COMMENT_ID: ${{ steps.request-comment.outputs.comment_node_id }}
        run: |
          set -o pipefail
          owner="${REPO%%/*}"; name="${REPO##*/}"
          HAS_COMMENT="false"
          [ -n "$COMMENT_ID" ] && HAS_COMMENT="true"
          if ! poll=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!, $hasComment: Boolean!, $commentId: ID!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  comments(last: 50) { nodes { author { login } body createdAt } }
                  reviews(last: 50) { nodes { author { login } commit { oid } submittedAt } }
                  reactions(last: 50, content: THUMBS_UP) { nodes { user { login } createdAt } }
                }
              }
              commentNode: node(id: $commentId) @include(if: $hasComment) {
                ... on IssueComment {
                  reactions(last: 50, content: THUMBS_UP) { nodes { user { login } createdAt } }
                }
              }
            }' -f owner="$owner" -f name="$name" -F pr="$PR" -F hasComment="$HAS_COMMENT" -f commentId="${COMMENT_ID:-placeholder}" \
            2>/tmp/poll-err.log \
            | jq --arg since "$SINCE" --arg sha "$HEAD_SHA" '
              # error_head_tied (Codex P2, manta PR #200 review round 3, restored from the
              # pre-migration inline poller): fails the gate immediately on a Codex-reported
              # error tied to this exact revision (quota/auth/workspace/ref-not-found) instead
              # of leaving the check in_progress until the org-wide timeout-scan backstop --
              # see reference_manta_one_report_per_hop_delay_compensation_impossible-adjacent
              # incident on pancetta#362, 2026-09-09, where this exact error repeated twice 71
              # minutes apart for the same SHA under the old poller.
              def is_error_shaped: test("(you exceeded your current quota|quota exceeded|rate limit reached|rate.?limit exceeded|unable to (access|start|review)|cannot access|authentication (failed|error)|workspace error|failed to (access|clone|start)|create a codex account and connect|something went wrong)"; "i");
              def reviewed_commit_prefix: try (.body | capture("[Rr]eviewed commit:?\\**\\s*`(?<c>[0-9a-f]{7,40})`").c) catch null;
              def is_codex_bot: . == "chatgpt-codex-connector" or . == "chatgpt-codex-connector[bot]";
              .data.repository.pullRequest as $p
              | ([$p.comments.nodes[] | select(.author.login=="chatgpt-codex-connector" and .createdAt >= $since)]) as $fresh_comments
              | {
                  comments: ([$fresh_comments[] | select(.body | is_error_shaped | not)] | length),
                  comment_head_tied: ([$fresh_comments[]
                    | select(.body | is_error_shaped | not)
                    | select((reviewed_commit_prefix // "") as $c | $c != "" and ($sha | startswith($c)))
                  ] | length),
                  error_comments: ([$fresh_comments[] | select(.body | is_error_shaped)] | length),
                  # error_head_tied: an error-shaped comment whose body contains this exact
                  # HEAD_SHA verbatim (a ref-not-found error embeds the full SHA) -- as tightly
                  # scoped to "this request" as comment_head_tied is for a success. NOTE: no
                  # apostrophes in ANY comment inside this jq program -- the whole block is one
                  # bash single-quoted string, so an apostrophe here terminates it early and
                  # corrupts everything after (confirmed live, this exact fix, round 3).
                  error_head_tied: ([$fresh_comments[] | select(.body | is_error_shaped) | select(.body | contains($sha))] | length),
                  reviews: ([$p.reviews.nodes[] | select(.author.login=="chatgpt-codex-connector" and .commit.oid==$sha and .submittedAt >= $since)] | length),
                  thumbsup: ([$p.reactions.nodes[] | select(.user.login | is_codex_bot) | select(.createdAt >= $since)] | length),
                  comment_thumbsup: ([(.data.commentNode.reactions.nodes // [])[] | select(.user.login | is_codex_bot) | select(.createdAt >= $since)] | length)
                }'); then
            echo "::error::Error querying for a Codex signal: $(cat /tmp/poll-err.log 2>/dev/null)"
            exit 1
          fi
          reviews=$(echo "$poll" | jq '.reviews')
          comment_thumbsup=$(echo "$poll" | jq '.comment_thumbsup')
          comment_head_tied=$(echo "$poll" | jq '.comment_head_tied')
          error_head_tied=$(echo "$poll" | jq '.error_head_tied')
          if [ "$reviews" -gt 0 ] || [ "$comment_thumbsup" -gt 0 ] || [ "$comment_head_tied" -gt 0 ]; then
            echo "Codex responded on this revision: reviews=$reviews comment_thumbsup=$comment_thumbsup comment_head_tied=$comment_head_tied"
            echo "responded=true" >> "$GITHUB_OUTPUT"
          elif [ "$error_head_tied" -gt 0 ]; then
            # Deliberately NOT responded=true -- compute-verdict has no real review data to
            # process for an error signal (there's nothing to auto-resolve or apply the clean
            # label against). error_tied is its own output, checked separately by "Update the
            # check-run" below to fail the check directly, bypassing compute-verdict entirely.
            # Fail fast rather than leave the check in_progress until the org-wide 15min
            # timeout-scan backstop catches it -- Codex reported an error tied to THIS exact
            # revision (a ref-not-found, quota, or auth failure), which will not resolve itself
            # by waiting (HagaleTechnologies/pancetta#362, 2026-09-09: this exact error repeated
            # twice 71 minutes apart for the same SHA under the old poller).
            echo "::error::Codex reported an error for this exact revision ($HEAD_SHA) instead of reviewing it -- failing now. Re-run this check once the underlying Codex issue is resolved."
            echo "responded=false" >> "$GITHUB_OUTPUT"
            echo "error_tied=true" >> "$GITHUB_OUTPUT"
          else
            echo "No tied Codex signal found for $HEAD_SHA in this event -- leaving the check in_progress for the next event or the timeout backstop."
            echo "responded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute the verdict and auto-resolve eligible threads
        id: compute-verdict
        if: steps.head-check.outputs.stale != 'true' && steps.verdict.outputs.responded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVE_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr-context.outputs.pr }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          RUN_STARTED: ${{ steps.request-comment.outputs.run_started }}
          IS_GENUINE_SYNC: ${{ github.run_attempt == 1 }}
        run: |
          set -o pipefail
          # Re-check the PR's LIVE head immediately before mutating anything (Codex P1, manta
          # PR #200 review round 3): "Resolve PR context" captured HEAD_SHA once, at the start
          # of this run -- if a push lands afterward, this response run is NOT cancelled (a
          # synchronize event's own request-job concurrency group is separate from this
          # response job's), so without this recheck, a late response could resolve a thread or
          # apply codex-clean against the SUPERSEDED head using a review Codex never actually
          # performed against the new revision. `stale=true` here means "no-op, a fresh
          # request/response cycle for the new head owns this PR now" -- exactly the same
          # contract steps.head-check.outputs.stale already has for the pull_request_review
          # path; "Update the check-run" below is skipped for the same reason.
          live_head_sha=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha' 2>/dev/null || echo "")
          if [ -n "$live_head_sha" ] && [ "$live_head_sha" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$PR's live head ($live_head_sha) no longer matches this response's head ($HEAD_SHA) -- skipping as superseded, a fresh cycle for the new head owns this PR now."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          apply_clean_label() {
            local label="codex-clean:${HEAD_SHA:0:12}"
            for _ in 1 2 3; do
              gh label create "$label" --color 0e8a16 \
                --description "This revision's Codex round raised nothing new -- safe to run the expensive gated jobs" \
                --repo "$REPO" >/dev/null 2>&1 || true
              if gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$label" >/dev/null 2>&1; then
                echo "Applied $label."
                return 0
              fi
              sleep 5
            done
            echo "::warning::Could not apply $label after 3 attempts."
            return 1
          }

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          baseline='${{ steps.baseline.outputs.baseline_pure }}'
          baseline_initiated='${{ steps.baseline.outputs.baseline_initiated }}'
          [ -z "$baseline" ] && baseline='[]'
          [ -z "$baseline_initiated" ] && baseline_initiated='[]'

          result=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      path
                      comments(first: 50) { nodes { author { login } createdAt originalCommit { oid } } }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f name="$NAME" -F pr="$PR" \
            | jq --argjson baseline "$baseline" --argjson baselineInitiated "$baseline_initiated" --arg since "$RUN_STARTED" '
              def ignorable_author: . == "chatgpt-codex-connector" or . == "github-actions";
              def codex_initiated: (.comments.nodes[0].author.login == "chatgpt-codex-connector");
              def restated_by_codex:
                [.comments.nodes[] | select(.author.login == "chatgpt-codex-connector" and .createdAt >= $since)] | length > 0;
              .data.repository.pullRequest.reviewThreads.nodes as $nodes
              | ($nodes
                  | map(select(.isResolved == false)
                        | select(codex_initiated)
                        | .id)) as $codex_unresolved
              | {
                  new_count: (($codex_unresolved - $baselineInitiated) | length),
                  restated_count: ([$nodes[]
                    | select(.isResolved == false)
                    | select(codex_initiated)
                    | select(.id as $id | $baselineInitiated | index($id))
                    | select(restated_by_codex)
                  ] | length),
                  unresolved_baseline_count: ([$codex_unresolved[] | select(. as $id | $baselineInitiated | index($id))] | length),
                  resolvable: [
                    $nodes[]
                    | select(.isResolved == false)
                    | select(.id as $id | $baseline | index($id))
                    | select([.comments.nodes[].author.login] | all(ignorable_author))
                    | select([.comments.nodes[] | select(.createdAt >= $since)] | length == 0)
                    | {id, path, findingSha: (.comments.nodes[0].originalCommit.oid // "")}
                  ]
                }')

          new_count=$(echo "$result" | jq '.new_count')
          restated_count=$(echo "$result" | jq '.restated_count')
          unresolved_baseline_count=$(echo "$result" | jq '.unresolved_baseline_count')

          if [ "$new_count" -gt 0 ]; then
            echo "::error::Codex raised $new_count new concern(s) on this revision — resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            exit 1
          fi
          if [ "$restated_count" -gt 0 ]; then
            echo "::error::Codex restated $restated_count still-live concern(s) in an existing thread on this revision — resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            exit 1
          fi
          if [ "$IS_GENUINE_SYNC" != "true" ] && [ "$unresolved_baseline_count" -gt 0 ]; then
            echo "::error::This is a rerun with $unresolved_baseline_count still-unresolved baseline concern(s) that nothing here will clear — resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            exit 1
          fi

          apply_clean_label || true

          if [ "$IS_GENUINE_SYNC" != "true" ]; then
            echo "This round is a rerun, not a genuine synchronize — the code hasn't changed, so not auto-resolving baseline threads that may still describe it (the label above still applies regardless)."
            exit 0
          fi

          echo "$result" | jq -r '.resolvable[] | [.id, .path, .findingSha] | @tsv' | while IFS=$'\t' read -r thread_id path finding_sha; do
            [ -z "$thread_id" ] && continue
            if [ -z "$finding_sha" ]; then
              echo "::warning::Thread $thread_id has no recorded originating commit — cannot confirm '$path' was touched since the finding was raised; leaving unresolved."
              continue
            fi
            if ! compare_response=$(gh api "repos/$REPO/compare/$finding_sha...$HEAD_SHA" 2>/tmp/compare-err.log); then
              echo "::warning::Could not compare $finding_sha...$HEAD_SHA for thread $thread_id — leaving unresolved: $(cat /tmp/compare-err.log 2>/dev/null)"
              continue
            fi
            merge_base=$(echo "$compare_response" | jq -r '.merge_base_commit.sha // ""')
            if [ "$merge_base" != "$finding_sha" ]; then
              echo "::warning::$finding_sha is not an ancestor of $HEAD_SHA (merge base: ${merge_base:-none}) — branch history was likely rewritten since the finding; leaving thread $thread_id unresolved: $path"
              continue
            fi
            compare_files=$(echo "$compare_response" | jq '[.files[]? | (.filename, (.previous_filename // empty))]')
            if ! echo "$compare_files" | jq -e --arg path "$path" 'any(. == $path)' >/dev/null; then
              echo "Skipping thread $thread_id — flagged file '$path' was not touched by any commit since the finding was raised."
              continue
            fi
            if ! live=$(gh api graphql -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequestReviewThread {
                    isResolved
                    comments(first: 50) { nodes { author { login } createdAt } }
                  }
                }
              }' -f id="$thread_id" 2>/tmp/live-recheck-err.log); then
              echo "::warning::Could not re-check thread $thread_id live state — leaving unresolved: $(cat /tmp/live-recheck-err.log 2>/dev/null)"
              continue
            fi
            live_resolved=$(echo "$live" | jq -r '.data.node.isResolved')
            live_pure=$(echo "$live" | jq '[.data.node.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions")')
            live_fresh=$(echo "$live" | jq --arg since "$RUN_STARTED" '[.data.node.comments.nodes[] | select(.createdAt >= $since)] | length == 0')
            if [ "$live_resolved" != "false" ] || [ "$live_pure" != "true" ] || [ "$live_fresh" != "true" ]; then
              echo "Skipping thread $thread_id — no longer eligible (resolved, human-touched, or a fresh comment landed since the snapshot)."
              continue
            fi
            pre_reply_count=$(echo "$live" | jq '.data.node.comments.nodes | length')
            if ! gh api graphql -f query='
              mutation($id: ID!, $body: String!) {
                addPullRequestReviewThreadReply(input: {pullRequestReviewThreadId: $id, body: $body}) {
                  comment { id }
                }
              }' -f id="$thread_id" -f body="Auto-resolved: Codex re-reviewed commit $HEAD_SHA after this push and raised no new concerns." 2>/tmp/reply-err.log; then
              echo "::warning::Could not reply to thread $thread_id — leaving unresolved: $(cat /tmp/reply-err.log)"
              continue
            fi
            if ! live2=$(gh api graphql -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequestReviewThread {
                    isResolved
                    comments(first: 50) { nodes { author { login } } }
                  }
                }
              }' -f id="$thread_id" 2>/tmp/live-recheck2-err.log); then
              echo "::warning::Could not re-verify thread $thread_id before resolving — leaving unresolved: $(cat /tmp/live-recheck2-err.log 2>/dev/null)"
              continue
            fi
            post_reply_resolved=$(echo "$live2" | jq -r '.data.node.isResolved')
            post_reply_pure=$(echo "$live2" | jq '[.data.node.comments.nodes[].author.login] | all(. == "chatgpt-codex-connector" or . == "github-actions")')
            post_reply_count=$(echo "$live2" | jq '.data.node.comments.nodes | length')
            if [ "$post_reply_resolved" != "false" ] || [ "$post_reply_pure" != "true" ] || [ "$post_reply_count" -ne "$((pre_reply_count + 1))" ]; then
              echo "::warning::Thread $thread_id changed between reply and resolve — leaving unresolved (has a reply, but not auto-resolved)."
              continue
            fi
            if ! GH_TOKEN="$RESOLVE_TOKEN" gh api graphql -f query='
              mutation($id: ID!) {
                resolveReviewThread(input: {threadId: $id}) {
                  thread { isResolved }
                }
              }' -f id="$thread_id" 2>/tmp/resolve-err.log; then
              echo "::warning::Could not resolve thread $thread_id (left a reply; may need manual resolution): $(cat /tmp/resolve-err.log)"
              continue
            fi
            echo "Auto-resolved thread $thread_id"
          done

      - name: Update the check-run
        # Also runs for a tied-error verdict (Codex P2, manta PR #200 review round 3) --
        # compute-verdict itself only runs for a real `responded=true` signal (nothing to
        # auto-resolve for an error), so this step's own OUTCOME below is forced to "failure"
        # directly for that case instead of reading compute-verdict's (unset) outcome. Skipped
        # entirely when compute-verdict found itself superseded (its own `stale` output, see
        # that step's own comment) -- there is nothing to relay for a response run whose head
        # a fresh push already moved past.
        if: >-
          always() && steps.head-check.outputs.stale != 'true' &&
          steps.compute-verdict.outputs.stale != 'true' &&
          (steps.verdict.outputs.responded == 'true' || steps.verdict.outputs.error_tied == 'true')
        env:
          # PAT, not github.token, for EVERY call in this step, including the PATCHes (not just
          # the workflow_dispatch POST) -- self-caught live on manta PR #200's own first real
          # round: github.token 403'd patching a check-run this job's OWN workflow run didn't
          # create ("Check run status and conclusions can only be updated internally by GitHub
          # Actions"), even with this file's workflow-level `checks: write` granted -- the
          # check-run was created by codex-review-request, a DIFFERENT prior run, and GitHub
          # restricts cross-run check-run mutation via the ephemeral per-run GITHUB_TOKEN. A
          # real-user PAT has no such restriction (same reasoning as RESOLVE_TOKEN above, and
          # the workflow_dispatch POST's own pre-existing PAT requirement).
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          OUTCOME: ${{ steps.compute-verdict.outcome }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CODEX_REVIEW_PAT not set -- cannot update the check-run or dispatch ci-full.yml for $HEAD_SHA."
            exit 1
          fi
          # .status == "in_progress" (Codex P2, manta PR #200 review round 3): without this, a
          # SECOND qualifying Codex event for the same request (e.g. a review followed moments
          # later by a thumbsup reaction on the same comment) finds the check-run this step's
          # OWN earlier run already completed, and dispatches ci-full.yml a second time -- the
          # identical SHA joins the same concurrency group and can cancel the first, already-
          # healthy run right after it created the required test check-runs, replacing it with
          # an unnecessary rerun that may itself fail or be cancelled. Restricting to
          # in_progress means a second event for an already-finalized check finds nothing here
          # and no-ops via the warning branch below, exactly like "already completed by a prior
          # event" already did for the request-job-not-run-yet case.
          check_id=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Codex review clean (gate before expensive downstream jobs)" and .status == "in_progress") | .id' | head -1)
          if [ -z "$check_id" ]; then
            echo "::warning::No matching in_progress check-run found for $HEAD_SHA -- nothing to update (it may have already been completed by a prior event, or the request job hasn't created it yet)."
            exit 0
          fi
          wait_check_id=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Wait for Codex Review" and .status == "in_progress") | .id' | head -1)
          if [ "$OUTCOME" = "success" ]; then
            gh api -X PATCH "repos/$REPO/check-runs/$check_id" -f status="completed" -f conclusion="success"
            [ -n "$wait_check_id" ] && gh api -X PATCH "repos/$REPO/check-runs/$wait_check_id" -f status="completed" -f conclusion="success"
            default_branch=$(gh api "repos/$REPO" --jq '.default_branch')
            gh api -X POST "repos/$REPO/actions/workflows/ci-full.yml/dispatches" \
              -f ref="$default_branch" -f "inputs[head_sha]=$HEAD_SHA"
          else
            gh api -X PATCH "repos/$REPO/check-runs/$check_id" \
              -f status="completed" -f conclusion="failure" \
              -f output[title]="Codex raised new concerns" \
              -f output[summary]="See this job's log for details -- resolve or ticket them, then push a remediation commit to trigger a fresh re-review."
            [ -n "$wait_check_id" ] && gh api -X PATCH "repos/$REPO/check-runs/$wait_check_id" \
              -f status="completed" -f conclusion="failure" \
              -f output[title]="Codex raised new concerns" \
              -f output[summary]="See the \"Codex review clean...\" check's log for details."
          fi

  # Native pass-through for merge-group evaluation -- unchanged in spirit from the pre-migration
  # version of this file, just its own job now (matching cqdx/widdershins/vanity's identical
  # convention) instead of a step gated inside a single combined job. GITHUB_TOKEN (not
  # CODEX_REVIEW_PAT): this only creates a repo-local check-run, not a PR mutation.
  wait-for-codex-merge-group-passthrough:
    name: Wait for Codex Review
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      checks: write
    steps:
      - name: Report a completed, successful check-run for the merge-group SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          gh api -X POST "repos/${REPO}/check-runs" \
            -f name="Wait for Codex Review" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="success" \
            -f output[title]="Merge-group pass-through" \
            -f output[summary]="The constituent PR already passed a real Wait for Codex Review during its own PR phase; nothing further to review on this synthetic integration commit." \
            >/dev/null
