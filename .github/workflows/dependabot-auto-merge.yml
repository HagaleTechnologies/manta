name: Dependabot Auto-Merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # dependabot/fetch-metadata outputs are safe (controlled by GitHub, not user input)
      - name: Auto-approve minor/patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approved: ${UPDATE_TYPE} update for ${DEP_NAMES}"

      # Native merge-queue cutover: arms auto-merge here (not in
      # auto-merge-trigger.yml) because GitHub withholds custom secrets
      # like CODEX_REVIEW_PAT from Dependabot-actor-triggered runs --
      # GITHUB_TOKEN is fine here since it's already proven working for
      # the approve/label steps above. Arming via GITHUB_TOKEN
      # (github-actions[bot]) is deliberate, not an oversight: that
      # identity is NOT a bypass actor on manta-review-gate, so the
      # eventual merge only executes once required_approving_review_count
      # is satisfied for real -- which the approval step immediately
      # above already provides. No bypass needed or wanted for this path.
      #
      # needs-human guard (learned from widdershins auto-merge.yml round 21,
      # applied here preemptively rather than rediscovered): this workflow
      # triggers on `synchronize` too (pull_request_target's default
      # types), which fires every time Dependabot itself rebases/updates the
      # PR against a moved base -- a routine, expected event, not a new
      # human decision. Without this guard, that rebase would silently
      # re-arm auto-merge on a PR queue-retry-handler.yml already handed
      # off to a human after its one automatic retry failed, bypassing that
      # handoff entirely.
      #
      # Checked inside the run: block via a fresh API fetch, not in this
      # step's own `if:` (Codex round 2): `github.event.pull_request.labels`
      # is a snapshot taken when the webhook fired, not a live read -- if
      # needs-human gets attached AFTER that snapshot but before this step
      # actually runs (e.g. `dependabot/fetch-metadata` above ran slowly),
      # the stale snapshot still reads "no needs-human" and this step would
      # re-arm auto-merge on a PR that was, by the time it actually acts,
      # already handed off. A step-level `if:` has no way to re-evaluate
      # itself against live state right before its `run:` executes; only a
      # fetch inside the step body can.
      - name: Enable auto-merge for approved update
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          current_labels=$(gh api --paginate "repos/${REPO}/issues/${PR}/labels" --jq '.[].name')
          if grep -qxF "needs-human" <<< "$current_labels"; then
            # Staleness check (queue-retry-handler.yml Codex round 4): needs-human is PR-wide
            # and has no automatic clearing mechanism -- a human decision by design -- but
            # queue-retry-handler.yml tags every attach with the exact SHA it was for. Without
            # this check, a fresh Dependabot rebase that resolves the original failure would
            # read the exact same "needs-human present" state the broken one did, and stay
            # silently stalled forever. Fail closed on uncertainty: only treat it as stale
            # when a marker positively names an OLDER sha than the PR's current head -- no
            # marker found (a transient comment-post failure, or needs-human applied by some
            # other means) keeps the pause in force, same as before this check existed.
            current_head_sha12=$(gh pr view "$PR" --repo "${REPO}" --json headRefOid --jq '.headRefOid[0:12]')
            comment_bodies=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
            recorded_sha12=$(grep -oE 'queue-retry-handler:needs-human sha=[0-9a-f]{12}' <<< "$comment_bodies" | tail -1 | grep -oE '[0-9a-f]{12}$')
            if [ -n "$recorded_sha12" ] && [ "$recorded_sha12" != "$current_head_sha12" ]; then
              echo "::notice::needs-human was recorded for commit $recorded_sha12, but PR #$PR's current head is $current_head_sha12 -- the handoff is stale (a fix was pushed since); proceeding to arm auto-merge for the new revision."
              gh pr merge "$PR_URL" --auto --squash
            else
              echo "::notice::PR #$PR has needs-human covering its current head -- standing down without re-arming auto-merge."
            fi
          else
            gh pr merge "$PR_URL" --auto --squash
          fi

      - name: Label major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PREV_VER: ${{ steps.metadata.outputs.previous-version }}
          NEW_VER: ${{ steps.metadata.outputs.new-version }}
        run: |
          gh pr edit "$PR_URL" --add-label "major-update,needs-review"
          gh pr comment "$PR_URL" --body "Major version bump: ${DEP_NAMES} (${PREV_VER} -> ${NEW_VER}). Requires manual review before merge."
